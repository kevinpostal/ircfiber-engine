services:
  ircfiber-gateway:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime-gateway
    image: irc-fiber-gateway:latest
    container_name: ircfiber-gateway
    restart: unless-stopped
    command: ["/app/irc-fiber"]
    networks:
      - irc_network
      - signoz-network
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      IRCFIBER_REDIS_URL: redis://redis:6379/0
      IRCFIBER_MONGO_URL: mongodb://mongo:27017/ircfiber
      IRCFIBER_CONFIG_PATH: /config/prod.conf
      IRCFIBER_LOG_LEVEL: info
      IRCFIBER_OTEL_ENABLED: "${IRCFIBER_OTEL_ENABLED:-0}"
      IRCFIBER_OTEL_ENDPOINT: "${IRCFIBER_OTEL_ENDPOINT:-http://otel-collector:4318}"
    volumes:
      - ./config/prod.conf:/config/prod.conf:ro
      - irc_fiber_logs:/var/log/irc-fiber
    ports:
      - "${GATEWAY_HOST_PORT:-8090}:8090"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ircfiber-engine:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime-engine
    image: irc-fiber-engine:latest
    container_name: ircfiber-engine
    restart: unless-stopped
    command: ["/app/irc-fiber-engine"]
    networks:
      - irc_network
      - signoz-network
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ircd:
        condition: service_healthy
    environment:
      IRCFIBER_REDIS_URL: redis://redis:6379/0
      IRCFIBER_MONGO_URL: mongodb://mongo:27017/ircfiber
      IRCFIBER_LOG_LEVEL: info
      IRCFIBER_SERVER_ID: dockerengine1
      IRCFIBER_BIND_ADDRESS: 0.0.0.0
      IRCFIBER_OTEL_ENABLED: "${IRCFIBER_OTEL_ENABLED:-0}"
      IRCFIBER_OTEL_ENDPOINT: "${IRCFIBER_OTEL_ENDPOINT:-http://otel-collector:4318}"
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "/usr/local/bin/ircfiber-engine-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: irc_redis_test
    restart: unless-stopped
    networks:
      - irc_network
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    container_name: irc_mongo_test
    restart: unless-stopped
    networks:
      - irc_network
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ircfiber
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ircd:
    build:
      context: ./docker/ircd
      dockerfile: Dockerfile
    image: ircd-test:latest
    container_name: ircd_test
    restart: unless-stopped
    networks:
      - irc_network
    ports:
      - "${IRCD_HOST_PORT:-6667}:6667"
      - "${IRCD_HOST_PORT2:-6668}:6668"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6667"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: ircfiber-fluent-bit
    restart: unless-stopped
    networks:
      - signoz-network
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/local/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]

networks:
  irc_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  signoz-network:
    driver: bridge
volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  irc_fiber_logs:
    driver: local
