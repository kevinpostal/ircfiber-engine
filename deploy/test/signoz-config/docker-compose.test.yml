# IRC Fiber — local test sandbox for the SigNoz ClickHouse config.
#
# This docker-compose brings up JUST clickhouse-keeper + clickhouse with
# the production overrides file. It's used by the test script
# (test-clickhouse-config.sh) to validate that the XML config we ship
# actually parses and starts cleanly BEFORE we push it to the OVH server.
#
# Why this exists: in June 2026 we shipped a new
# clickhouse-server-overrides.xml that turned out to fail at boot with
# "Code: 36. DB::Exception: ... is greater than ..." — the <logger> block
# had the size/count nodes nested under <log>/<errorlog> (wrong for 25.x
# where they must be siblings). ClickHouse restarts forever in that
# state. We only caught it by reading the post-deploy container log on
# the live server. This sandbox catches the same class of bug locally
# in ~3 seconds.
#
# Usage:
#   ./test-clickhouse-config.sh                # boot, validate, teardown
#   docker compose -f docker-compose.test.yml up  # manual poke around
#   docker compose -f docker-compose.test.yml down --volumes
#
# State lives in the named volume ircfiber-test-clickhouse-data; remove
# it with `down --volumes` between runs if you want a clean slate.

x-logging-common: &logging-common
  restart: unless-stopped

services:
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:25.5.6
    container_name: test-clickhouse-keeper
    hostname: test-clickhouse-keeper
    networks:
      - test-logging
    expose:
      - "9181"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 9181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: test-clickhouse
    hostname: test-clickhouse
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    networks:
      - test-logging
    expose:
      - "9000"
      - "8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      # Source file is bind-mounted so editing deploy/roles/signoz/files/
      # clickhouse-server-overrides.xml takes effect on the next
      # `./test-clickhouse-config.sh` run without rebuilding anything.
      - ../../roles/signoz/files/clickhouse-server-overrides.xml:/etc/clickhouse-server/config.d/server-overrides.xml:ro
      - ../../roles/signoz/files/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ircfiber-test-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  test-logging:
    name: test-ircfiber-logging

volumes:
  ircfiber-test-clickhouse-data:
