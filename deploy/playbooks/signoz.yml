---
# IRC Fiber — deploy SigNoz observability stack.
#
# SigNoz replaces Grafana + Loki + Tempo + Promtail + Prometheus
# with a single integrated platform for logs, traces, metrics,
# flamegraphs, and service maps.
#
# Stack:
#   signoz-frontend (UI) → query-service (API) → clickhouse (storage)
#   engine → otel-collector (OTLP + filelog) → query-service
#
# All containers join the existing ircfiber_logging network. The
# engine is already on this network and will push OTel traces
# directly to ircfiber-signoz-otel:4318.

- name: Deploy IRC Fiber SigNoz observability stack
  hosts: ircfiber
  become: true
  gather_facts: true

  tasks:
    - name: Ensure ircfiber_logging Docker network exists
      community.docker.docker_network:
        name: ircfiber_logging
        driver: bridge
        state: present

    - name: Deploy SigNoz stack
      ansible.builtin.include_role:
        name: signoz

    - name: Report health
      ansible.builtin.debug:
        msg: |
          SigNoz deployment complete.
          Frontend:  http://{{ caddy_tailscale_logging_address | default('100.126.197.92') }}:{{ caddy_tailscale_signoz_port | default(3003) }}
          Login:     admin / admin