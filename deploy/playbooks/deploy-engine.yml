---
# Engine deploy — engine only, never touches gateway
# Replaces deploy-update.yml engine half. Engine owns /opt/ircfiber-engine
# Usage: ansible-playbook deploy/playbooks/deploy-engine.yml -l vps-efb4b52d
- name: Deploy engine
  hosts: "{{ target | default('ircfiber_engines') }}"
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventories/production/group_vars/all.yml"
    - "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"
  vars:
    src_root: /opt/ircfiber-engine
    builder_image: ircfiber-builder-engine
    host_bin_dir: /opt/ircfiber/bin
    engine_container: "{{ ('ircfiber-engine-' ~ ircfiber_engine_id) if ircfiber_engine_id is defined else 'ircfiber-engine-ovh' }}"
    ldc_version: "1.41.0"
  tasks:
    - name: Preflight — engine deploy targets engine hosts only
      ansible.builtin.assert:
        that: "'ircfiber_engines' in group_names or 'ircfiber_engine' in group_names or ircfiber_engine_id is defined"
        fail_msg: "Engine deploy must target engine hosts"
    - name: rsync engine source → {{ src_root }}
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: true
        checksum: true
        rsync_opts:
          - "--omit-dir-times"
          - "--exclude=.git"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=.worktrees"
    - name: Build engine image (engine only)
      ansible.builtin.shell: |
        DOCKER_BUILDKIT=1 docker build           --target runtime-engine           --build-arg GIT_HASH={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ rev-parse HEAD') | default('unknown') }}           --build-arg GIT_SHORT={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ rev-parse --short HEAD') | default('unknown') }}           --build-arg GIT_DESCRIBE={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ describe --always --long') | default('unknown') }}           --build-arg GIT_BRANCH={{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ rev-parse --abbrev-ref HEAD') | default('unknown') }}           -t kevindpostal/irc-fiber-engine:0.3.0           -f {{ src_root }}/Containerfile.engine           {{ src_root }} 2>&1
      args:
        executable: /bin/bash
      timeout: 1800
    # Per-user IPv6: host prep (sysctl + local route) and env-file lines.
    # deploy-engine.yml deliberately does not re-render env.j2 (that needs the
    # tailscale/vault facts the engine role gathers), so the two IPv6 keys are
    # managed line-wise here: present when ircfiber_ipv6_prefix is set, removed
    # when it is cleared, so a flip in group_vars/host_vars is one deploy.
    - name: Per-user IPv6 host prep (no-op unless ircfiber_ipv6_prefix is set)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/engine/tasks/ipv6.yml"
    - name: Sync IRCFIBER_IPV6_PREFIX in engine env file
      ansible.builtin.lineinfile:
        path: /etc/ircfiber/engine/env-{{ ircfiber_engine_id }}
        regexp: '^IRCFIBER_IPV6_PREFIX='
        line: "IRCFIBER_IPV6_PREFIX={{ ircfiber_ipv6_prefix | default('') }}"
        state: "{{ 'present' if (ircfiber_ipv6_prefix | default('') | length > 0) else 'absent' }}"
    - name: Sync IRCFIBER_IPV6_POOL_HOST in engine env file
      ansible.builtin.lineinfile:
        path: /etc/ircfiber/engine/env-{{ ircfiber_engine_id }}
        regexp: '^IRCFIBER_IPV6_POOL_HOST='
        line: "IRCFIBER_IPV6_POOL_HOST={{ ircfiber_ipv6_pool_host | default('') }}"
        state: "{{ 'present' if (ircfiber_ipv6_pool_host | default('') | length > 0) else 'absent' }}"
    # Mirrors roles/engine/tasks/main.yml (ulimits, security_opts, labels).
    # Without `--ulimit nofile` the container inherited dockerd's 1024 soft
    # limit; on 2026-09-02 the engine exhausted it after ~8 h (fd leak) and
    # lost DNS/Redis/Mongo/IRC until ircfiber-monitor restarted it.
    # IPv6: when ircfiber_ipv6_prefix is set, use host network to preserve the
    # per-user source IP (bridge NAT66 would masquerade it to the host address).
    - name: Recreate engine container with new image (bridge, IPv6 disabled)
      when: ircfiber_ipv6_prefix is not defined or ircfiber_ipv6_prefix | length == 0
      ansible.builtin.shell: |
        docker stop {{ engine_container }} 2>/dev/null || true
        docker rm {{ engine_container }} 2>/dev/null || true
        docker run -d --name {{ engine_container }} --restart unless-stopped \
          --network ircfiber_net --network ircfiber_logging \
          --env-file /etc/ircfiber/engine/env-{{ ircfiber_engine_id }} \
          --ulimit nofile=65536:65536 \
          --security-opt no-new-privileges:true \
          --label com.ircfiber.component=engine \
          --label com.ircfiber.engine_id={{ ircfiber_engine_id }} \
          kevindpostal/irc-fiber-engine:0.3.0 /usr/local/bin/ircfiber-engine-entrypoint.sh
      changed_when: true

    - name: Recreate engine container with new image (host, IPv6 enabled)
      when: ircfiber_ipv6_prefix is defined and ircfiber_ipv6_prefix | length > 0
      ansible.builtin.shell: |
        docker stop {{ engine_container }} 2>/dev/null || true
        docker rm {{ engine_container }} 2>/dev/null || true
        docker run -d --name {{ engine_container }} --restart unless-stopped \
          --network host \
          --env-file /etc/ircfiber/engine/env-{{ ircfiber_engine_id }} \
          --ulimit nofile=65536:65536 \
          --security-opt no-new-privileges:true \
          --label com.ircfiber.component=engine \
          --label com.ircfiber.engine_id={{ ircfiber_engine_id }} \
          kevindpostal/irc-fiber-engine:0.3.0 /usr/local/bin/ircfiber-engine-entrypoint.sh
      changed_when: true
