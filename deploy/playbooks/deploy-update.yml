---
# Enterprise-grade hot-path deploy — BuildKit with persistent dub cache.
#
# Uses `docker build --target builder` with BuildKit cache mounts.
# The Containerfile's `RUN --mount=type=cache,target=/build/.dub` persists
# dub packages + .o files across builds inside the Docker engine's BuildKit
# cache. Only changed .d files recompile (dub rebuilds incremental).
#
# Architecture:
#   1. rsync source → /opt/ircfiber-src/ (only changed files, ~1s for no-op)
#   2. DOCKER_BUILDKIT=1 docker build --target builder
#      - LDC layer cached (no re-download)
#      - dub fetch + packages cached via BuildKit mount
#      - Only changed .d files recompile
#   3. Extract binaries from builder image (docker create → docker cp → docker rm)
#   4. docker cp into running gateway + engine, then restart
#
# First run: ~80-90s (full dub build). Subsequent runs: ~5-15s.
#
# Usage:
#   make update
#   ansible-playbook playbooks/deploy-update.yml -l ircfiber-prod-1

- name: Hot-path deploy
  hosts: "{{ target | default('ircfiber_gw:ircfiber_engines') }}"
  become: true
  gather_facts: false

  vars:
    src_root: /opt/ircfiber-src
    builder_image: ircfiber-builder
    host_bin_dir: /opt/ircfiber/bin
    gateway_container: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    engine_container: "{{ 'ircfiber-engine-' ~ ircfiber_engine_id }}"
    ldc_version: "1.41.0"
    gateway_binary: "{{ host_bin_dir }}/irc-fiber"
    engine_binary: "{{ host_bin_dir }}/irc-fiber-engine"

  tasks:
    # ── Prerequisites ──────────────────────────────────────────────────
    - name: Ensure output directory
      ansible.builtin.file:
        path: "{{ host_bin_dir }}"
        state: directory
        mode: "0777"

    # ── rsync source ────────────────────────────────────────────────────
    - name: rsync source → {{ src_root }}
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=irc-fiber"
          - "--exclude=irc-fiber-engine"
          - "--exclude=frontend/node_modules"
          - "--exclude=public/dist"
          - "--exclude=.reasonix"
          - "--exclude=.playwright-mcp"
          - "--exclude=test-results"
          - "--exclude=e2e/test-results"
          - "--exclude=*.log"
          - "--exclude=.worktrees"

    # ── BuildKit build (incremental via cache mounts) ─────────────────
    # BuildKit retains the --mount=type=cache across builds as long as
    # the BuildKit daemon is alive. Dub's .dub/ directory lives in this
    # cache mount, so packages + .o files survive container rm.
    #
    # We target only the builder stage (no runtime image). That way we
    # skip COPY-ing into the slim runtime and all Dockerfile steps after
    # the dub build.
    - name: Build builder stage (BuildKit — cached dub + LDC)
      ansible.builtin.shell: |
        DOCKER_BUILDKIT=1 docker build \
          --target builder \
          --build-arg LDC_VERSION={{ ldc_version }} \
          --build-arg CACHE_BUST=$(date +%s) \
          -t {{ builder_image }}:latest \
          -f {{ src_root }}/Containerfile \
          {{ src_root }} 2>&1
      args:
        executable: /bin/bash
      timeout: 900
      changed_when: true

    # ── Extract both binaries in one shot ──────────────────────────
    - name: Extract binaries from builder image
      ansible.builtin.shell: |
        CID=$(docker create {{ builder_image }}:latest)
        docker cp "$CID":/build/irc-fiber {{ gateway_binary }}
        docker cp "$CID":/build/irc-fiber-engine {{ engine_binary }}
        docker rm "$CID" >/dev/null
        chmod 0755 {{ gateway_binary }} {{ engine_binary }}
        strip {{ gateway_binary }} {{ engine_binary }} 2>/dev/null || true
        echo "Gateway: $(ls -lh {{ gateway_binary }} | awk '{print $5}')"
        echo "Engine:  $(ls -lh {{ engine_binary }} | awk '{print $5}')"
      args:
        executable: /bin/bash

    # ── Inject views/admin/ into gateway ──────────────────────────
    # Templates are compiled at request time, so they must be synced
    # into the running container after build.
    - name: Sync admin views into gateway container
      ansible.builtin.shell: |
        if docker container inspect {{ gateway_container }} >/dev/null 2>&1; then
          docker cp {{ src_root }}/views/admin/. {{ gateway_container }}:/app/views/admin/
          echo "Admin views synced"
        else
          echo "No gateway container, skipping view sync"
        fi
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true

    # ── Inject + restart gateway ─────────────────────────────────────
    # Skip if no gateway container exists on this host (engine-only hosts)
    - name: Check if gateway container exists
      ansible.builtin.shell: |
        docker container inspect {{ gateway_container }} >/dev/null 2>&1 && echo yes || echo no
      register: gw_exists
      changed_when: false
      ignore_errors: true

    - name: Inject gateway binary
      ansible.builtin.command:
        cmd: docker cp {{ gateway_binary }} {{ gateway_container }}:/app/irc-fiber
      when: gw_exists.stdout == 'yes'

    - name: Restart gateway
      community.docker.docker_container:
        name: "{{ gateway_container }}"
        state: started
        restart: true
      when: gw_exists.stdout == 'yes'

    # ── Inject + restart engine ──────────────────────────────────────
    # For zero-disconnect deploys, use `deploy-handoff.yml` instead.
    # This hard-restart path closes all IRC sockets.
    - name: Inject engine binary
      ansible.builtin.command:
        cmd: docker cp {{ engine_binary }} {{ engine_container }}:/app/irc-fiber-engine

    - name: Restart engine (hard — closes IRC sockets)
      community.docker.docker_container:
        name: "{{ engine_container }}"
        state: started
        restart: true
