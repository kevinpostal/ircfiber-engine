---
# Enterprise-grade hot-path deploy — BuildKit with persistent dub cache.
#
# Uses `docker build --target builder` with BuildKit cache mounts.
# The Containerfile's `RUN --mount=type=cache,target=/build/.dub` persists
# dub packages + .o files across builds inside the Docker engine's BuildKit
# cache. Only changed .d files recompile (dub rebuilds incremental).
#
# Architecture:
#   1. rsync source → /opt/ircfiber-src/ (only changed files, ~1s for no-op)
#   2. DOCKER_BUILDKIT=1 docker build --target builder
#      - LDC layer cached (no re-download)
#      - dub fetch + packages cached via BuildKit mount
#      - Only changed .d files recompile
#   3. Extract binaries from builder image (docker create → docker cp → docker rm)
#   4. docker cp into running gateway + engine, then restart
#
# First run: ~80-90s (full dub build). Subsequent runs: ~5-15s.
#
# Usage:
#   make update
#   ansible-playbook playbooks/deploy-update.yml -l ircfiber-prod-1

- name: Hot-path deploy
  hosts: "{{ target | default('ircfiber_gw:ircfiber_engines') }}"
  become: true
  gather_facts: false

  vars:
    src_root: /opt/ircfiber-src
    builder_image: ircfiber-builder
    host_bin_dir: /opt/ircfiber/bin
    gateway_container: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    engine_container: "{{ ('ircfiber-engine-' ~ ircfiber_engine_id) if ircfiber_engine_id is defined else '' }}"
    ldc_version: "1.41.0"
    gateway_binary: "{{ host_bin_dir }}/irc-fiber"
    engine_binary: "{{ host_bin_dir }}/irc-fiber-engine"

  tasks:
    # ── Prerequisites ──────────────────────────────────────────────────
    - name: Ensure output directory
      ansible.builtin.file:
        path: "{{ host_bin_dir }}"
        state: directory
        mode: "0777"

    # ── rsync source ────────────────────────────────────────────────────
    - name: rsync source → {{ src_root }}
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=irc-fiber"
          - "--exclude=irc-fiber-engine"
          - "--exclude=frontend/node_modules"
          - "--exclude=public/dist"
          - "--exclude=.reasonix"
          - "--exclude=.playwright-mcp"
          - "--exclude=test-results"
          - "--exclude=e2e/test-results"
          - "--exclude=*.log"
          - "--exclude=.worktrees"

    # ── BuildKit build (incremental via cache mounts) ─────────────────
    # BuildKit retains the --mount=type=cache across builds as long as
    # the BuildKit daemon is alive. Dub's .dub/ directory lives in this
    # cache mount, so packages + .o files survive container rm.
    #
    # We target only the builder stage (no runtime image). That way we
    # skip COPY-ing into the slim runtime and all Dockerfile steps after
    # the dub build.
    - name: Build builder stage (BuildKit — cached dub + LDC)
      ansible.builtin.shell: |
        DOCKER_BUILDKIT=1 docker build \
          --target builder \
          --build-arg LDC_VERSION={{ ldc_version }} \
          --build-arg CACHE_BUST=$(date +%s) \
          -t {{ builder_image }}:latest \
          -f {{ src_root }}/Containerfile \
          {{ src_root }} 2>&1
      args:
        executable: /bin/bash
      timeout: 900
      changed_when: true

    # ── Extract both binaries in one shot ──────────────────────────
    - name: Extract binaries from builder image
      ansible.builtin.shell: |
        CID=$(docker create {{ builder_image }}:latest)
        docker cp "$CID":/build/irc-fiber {{ gateway_binary }}
        docker cp "$CID":/build/irc-fiber-engine {{ engine_binary }}
        docker rm "$CID" >/dev/null
        chmod 0755 {{ gateway_binary }} {{ engine_binary }}
        strip {{ gateway_binary }} {{ engine_binary }} 2>/dev/null || true
        echo "Gateway: $(ls -lh {{ gateway_binary }} | awk '{print $5}')"
        echo "Engine:  $(ls -lh {{ engine_binary }} | awk '{print $5}')"
      args:
        executable: /bin/bash

    # ── Inject views/admin/ into gateway ──────────────────────────
    # Templates are compiled at request time, so they must be synced
    # into the running container after build.
    - name: Sync admin views into gateway container
      ansible.builtin.shell: |
        if docker container inspect {{ gateway_container }} >/dev/null 2>&1; then
          docker cp {{ src_root }}/views/admin/. {{ gateway_container }}:/app/views/admin/
          echo "Admin views synced"
        else
          echo "No gateway container, skipping view sync"
        fi
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true

    # ── Inject + restart gateway ─────────────────────────────────────
    # Skip if no gateway container exists on this host (engine-only hosts)
    - name: Check if gateway container exists
      ansible.builtin.shell: |
        docker container inspect {{ gateway_container }} >/dev/null 2>&1 && echo yes || echo no
      register: gw_exists
      changed_when: false
      ignore_errors: true

    - name: Inject gateway binary
      ansible.builtin.command:
        cmd: docker cp {{ gateway_binary }} {{ gateway_container }}:/app/irc-fiber
      when: gw_exists.stdout == 'yes'

    - name: Restart gateway
      community.docker.docker_container:
        name: "{{ gateway_container }}"
        state: started
        restart: true
      when: gw_exists.stdout == 'yes'

    # ── Inject + handoff engine (zero disconnect) ────────────────────
    # The new binary runs inside the existing container alongside the
    # old engine. SCM_RIGHTS FD transfer preserves live IRC sockets
    # for plain TCP; TLS connections do a soft reconnect.
    - name: Check engine container is running
      community.docker.docker_container_info:
        name: "{{ engine_container }}"
      register: engine_info
      when: ircfiber_engine_id is defined

    - name: Get old engine PID
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} pidof irc-fiber-engine
      register: old_pid_raw
      changed_when: false
      failed_when: false
      when: ircfiber_engine_id is defined and engine_info.exists

    - name: Stage new binary in container
      ansible.builtin.command:
        cmd: docker cp {{ engine_binary }} {{ engine_container }}:/app/irc-fiber-engine-handoff
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    - name: Mark staged binary executable
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} chmod +x /app/irc-fiber-engine-handoff
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    - name: Remove stale handoff socket
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} rm -f /tmp/ircfiber-handoff-{{ ircfiber_engine_id }}.sock
      changed_when: false
      ignore_errors: true
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    - name: Set handoff vars for engine host
      ansible.builtin.set_fact:
        _engine_pid: "{{ old_pid_raw.stdout | trim | split(' ') | first }}"
        _handoff_sock: "/tmp/ircfiber-handoff-{{ ircfiber_engine_id }}.sock"
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    # ── Order matters: tell old engine to start the listener first,
    #     wait for the socket, THEN launch the new engine ─────────
    - name: Send gracefulReload control message (starts old engine listener)
      ansible.builtin.shell: |
        redis_url=$(docker exec {{ engine_container }} printenv IRCFIBER_REDIS_URL 2>/dev/null || echo "redis://127.0.0.1:6379/0")
        msg='{"action":"gracefulReload","config":{"newEnginePid":0,"socketPath":"{{ _handoff_sock }}","deadlineMs":30000}}'
        redis-cli -u "$redis_url" LPUSH "irc:control:{{ ircfiber_engine_id }}" "$msg"
        echo "Control message sent to irc:control:{{ ircfiber_engine_id }} via $redis_url"
      when:
        - ircfiber_engine_id is defined
        - engine_info.exists
        - old_pid_raw.rc == 0
      changed_when: true

    - name: Wait for handoff socket to appear (old engine listener ready)
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          if docker exec {{ engine_container }} test -S '{{ _handoff_sock }}' 2>/dev/null; then
            echo "SOCKET_READY"
            exit 0
          fi
          if ! docker exec {{ engine_container }} kill -0 {{ _engine_pid }} 2>/dev/null; then
            echo "ENGINE_DIED"
            exit 1
          fi
          sleep 1
        done
        echo "SOCKET_TIMEOUT"
        exit 1
      when:
        - ircfiber_engine_id is defined
        - engine_info.exists
        - old_pid_raw.rc == 0
      register: sock_ready
      ignore_errors: true
      changed_when: false

    - name: Launch new engine inside container (handoff mode)
      ansible.builtin.command:
        cmd: >
          docker exec -d
          -e IRCFIBER_RELOAD_FROM_PID={{ _engine_pid }}
          {{ engine_container }}
          /app/irc-fiber-engine-handoff
      when:
        - ircfiber_engine_id is defined
        - engine_info.exists
        - old_pid_raw.rc == 0
        - _engine_pid is defined
        - sock_ready.stdout == 'SOCKET_READY'

    - name: Wait for old engine to exit (handoff complete)
      ansible.builtin.shell: |
        old_pid={{ old_pid_raw.stdout | trim | split(' ') | first }}
        for i in $(seq 1 60); do
          if ! docker exec {{ engine_container }} kill -0 $old_pid 2>/dev/null; then
            echo "HANDOFF_OK"
            exit 0
          fi
          sleep 0.5
        done
        echo "HANDOFF_TIMEOUT"
        exit 1
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0
      register: handoff_ok
      ignore_errors: true
      changed_when: false

    - name: Replace binary on disk (persistent across container restarts)
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} mv -f /app/irc-fiber-engine-handoff /app/irc-fiber-engine
      when:
        - ircfiber_engine_id is defined
        - engine_info.exists
        - old_pid_raw.rc == 0
        - handoff_ok.stdout == 'HANDOFF_OK'

    - name: Wait for startup and verify new engine is running
      ansible.builtin.shell: |
        sleep 2
        pidof_out=$(docker exec {{ engine_container }} pidof irc-fiber-engine 2>/dev/null || echo "")
        if [ -n "$pidof_out" ]; then
          count=$(echo "$pidof_out" | wc -w)
          echo "Engine running: $count process(es) — PIDs: $pidof_out"
        else
          echo "Engine NOT running"
          exit 1
        fi
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0
