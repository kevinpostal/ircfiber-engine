---
# Enterprise-grade hot-path deploy — BuildKit with persistent dub cache.
#
# Uses `docker build --target builder` with BuildKit cache mounts.
# The Containerfile's `RUN --mount=type=cache,target=/build/.dub` persists
# dub packages + .o files across builds inside the Docker engine's BuildKit
# cache. Only changed .d files recompile (dub rebuilds incremental).
#
# Architecture:
#   1. rsync source → /opt/ircfiber-src/ (only changed files, ~1s for no-op)
#   2. DOCKER_BUILDKIT=1 docker build --target builder
#      - LDC layer cached (no re-download)
#      - dub fetch + packages cached via BuildKit mount
#      - Only changed .d files recompile
#   3. Extract binaries from builder image (docker create → docker cp → docker rm)
#   4. docker cp into running gateway + engine, then restart
#
# First run: ~80-90s (full dub build). Subsequent runs: ~5-15s.
#
# Usage:
#   make update
#   ansible-playbook playbooks/deploy-update.yml -l ircfiber-prod-1

- name: Hot-path deploy
  hosts: "{{ target | default('ircfiber_gw:ircfiber_engines') }}"
  become: true
  gather_facts: false

  vars:
    src_root: /opt/ircfiber-src
    builder_image: ircfiber-builder
    host_bin_dir: /opt/ircfiber/bin
    gateway_container: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    engine_container: "{{ ('ircfiber-engine-' ~ ircfiber_engine_id) if ircfiber_engine_id is defined else '' }}"
    ldc_version: "1.41.0"
    gateway_binary: "{{ host_bin_dir }}/irc-fiber"
    engine_binary: "{{ host_bin_dir }}/irc-fiber-engine"

  tasks:
    # ── Prerequisites ──────────────────────────────────────────────────
    - name: Ensure output directory
      ansible.builtin.file:
        path: "{{ host_bin_dir }}"
        state: directory
        mode: "0777"

    # ── rsync source ────────────────────────────────────────────────────
    - name: rsync source → {{ src_root }}
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=irc-fiber"
          - "--exclude=irc-fiber-engine"
          - "--exclude=frontend/node_modules"
          - "--exclude=public/dist"
          - "--exclude=.reasonix"
          - "--exclude=.playwright-mcp"
          - "--exclude=test-results"
          - "--exclude=e2e/test-results"
          - "--exclude=*.log"
          - "--exclude=.worktrees"

    # ── BuildKit build (incremental via cache mounts) ─────────────────
    # BuildKit retains the --mount=type=cache across builds as long as
    # the BuildKit daemon is alive. Dub's .dub/ directory lives in this
    # cache mount, so packages + .o files survive container rm.
    #
    # We target only the builder stage (no runtime image). That way we
    # skip COPY-ing into the slim runtime and all Dockerfile steps after
    # the dub build.
    - name: Build builder stage (BuildKit — cached dub + LDC)
      ansible.builtin.shell: |
        DOCKER_BUILDKIT=1 docker build \
          --target builder \
          --build-arg LDC_VERSION={{ ldc_version }} \
          --build-arg CACHE_BUST=$(date +%s) \
          -t {{ builder_image }}:latest \
          -f {{ src_root }}/Containerfile \
          {{ src_root }} 2>&1
      args:
        executable: /bin/bash
      timeout: 900
      changed_when: true

    # ── Extract both binaries in one shot ──────────────────────────
    - name: Extract binaries from builder image
      ansible.builtin.shell: |
        CID=$(docker create {{ builder_image }}:latest)
        docker cp "$CID":/build/irc-fiber {{ gateway_binary }}
        docker cp "$CID":/build/irc-fiber-engine {{ engine_binary }}
        docker rm "$CID" >/dev/null
        chmod 0755 {{ gateway_binary }} {{ engine_binary }}
        strip {{ gateway_binary }} {{ engine_binary }} 2>/dev/null || true
        echo "Gateway: $(ls -lh {{ gateway_binary }} | awk '{print $5}')"
        echo "Engine:  $(ls -lh {{ engine_binary }} | awk '{print $5}')"
      args:
        executable: /bin/bash

    # ── Inject views/admin/ into gateway ──────────────────────────
    # Templates are compiled at request time, so they must be synced
    # into the running container after build.
    - name: Sync admin views into gateway container
      ansible.builtin.shell: |
        if docker container inspect {{ gateway_container }} >/dev/null 2>&1; then
          docker cp {{ src_root }}/views/admin/. {{ gateway_container }}:/app/views/admin/
          echo "Admin views synced"
        else
          echo "No gateway container, skipping view sync"
        fi
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true

    # Non-admin views (login, register, index, layout, message_fragment)
    # are compiled at request time, so they must be synced into the
    # running container after build — same pattern as admin views.
    - name: Sync non-admin views into gateway container
      ansible.builtin.shell: |
        if docker container inspect {{ gateway_container }} >/dev/null 2>&1; then
          docker cp {{ src_root }}/views/login.dt    {{ gateway_container }}:/app/views/login.dt
          docker cp {{ src_root }}/views/register.dt {{ gateway_container }}:/app/views/register.dt
          docker cp {{ src_root }}/views/index.dt    {{ gateway_container }}:/app/views/index.dt
          docker cp {{ src_root }}/views/layout.dt   {{ gateway_container }}:/app/views/layout.dt
          docker cp {{ src_root }}/views/message_fragment.dt {{ gateway_container }}:/app/views/message_fragment.dt
          echo "Non-admin views synced"
        else
          echo "No gateway container, skipping view sync"
        fi
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true

    - name: Sync public assets into gateway container
      ansible.builtin.shell: |
        if docker container inspect {{ gateway_container }} >/dev/null 2>&1; then
          docker cp {{ src_root }}/public/. {{ gateway_container }}:/app/public/
          echo "Public assets synced"
        else
          echo "No gateway container, skipping asset sync"
        fi
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true

    # ── Inject + restart gateway ─────────────────────────────────────
    # Skip if no gateway container exists on this host (engine-only hosts)
    - name: Check if gateway container exists
      ansible.builtin.shell: |
        docker container inspect {{ gateway_container }} >/dev/null 2>&1 && echo yes || echo no
      register: gw_exists
      changed_when: false
      ignore_errors: true

    - name: Inject gateway binary
      ansible.builtin.command:
        cmd: docker cp {{ gateway_binary }} {{ gateway_container }}:/app/irc-fiber
      when: gw_exists.stdout == 'yes'

    - name: Restart gateway
      community.docker.docker_container:
        name: "{{ gateway_container }}"
        state: started
        restart: true
      when: gw_exists.stdout == 'yes'

    # ── Engine deploy: handoff if supported, hard restart otherwise ──
    - name: Check engine container exists
      community.docker.docker_container_info:
        name: "{{ engine_container }}"
      register: engine_info
      when: ircfiber_engine_id is defined

    - name: Get old engine PID
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} pidof irc-fiber-engine
      register: old_pid_raw
      changed_when: false
      failed_when: false
      when: ircfiber_engine_id is defined and engine_info.exists

    - name: Install tini in engine container (needed for handoff)
      ansible.builtin.shell: |
        if ! docker exec {{ engine_container }} which tini >/dev/null 2>&1; then
          docker exec {{ engine_container }} apt-get update -qq
          docker exec {{ engine_container }} apt-get install -y -qq tini
        fi
        echo "tini OK"
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0
      changed_when: true

    - name: Set engine handoff vars
      ansible.builtin.set_fact:
        _engine_pid: "{{ old_pid_raw.stdout | trim | split(' ') | first }}"
        _handoff_sock: "/tmp/ircfiber-handoff-{{ ircfiber_engine_id }}.sock"
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    - name: Stage new engine binary
      ansible.builtin.command:
        cmd: docker cp {{ engine_binary }} {{ engine_container }}:/app/irc-fiber-engine-handoff
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    - name: Mark staged binary executable
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} chmod +x /app/irc-fiber-engine-handoff
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    - name: Remove stale handoff socket and done marker
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} rm -f /tmp/ircfiber-handoff-{{ ircfiber_engine_id }}.sock /tmp/ircfiber-handoff-done-{{ ircfiber_engine_id }}
      changed_when: false
      ignore_errors: true
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0

    # Try handoff — old engine must already have handoff code for
    # this to work. If the engine was just deployed for the first
    # time with the handoff build, it won't know about the
    # "gracefulReload" control action. In that case we wait 5s and
    # fall back to a hard restart. Next deploy will use handoff.
    - name: Try handoff — send gracefulReload control message
      ansible.builtin.shell: |
        msg='{"action":"gracefulReload","config":{"socketPath":"{{ _handoff_sock }}","deadlineMs":30000}}'
        docker exec {{ redis_container_name | default('ircfiber-redis') }} redis-cli LPUSH "irc:control:{{ ircfiber_engine_id }}" "$msg"
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0
      changed_when: true

    - name: Wait for handoff socket (5s — old engine may not support handoff yet)
      ansible.builtin.shell: |
        for i in $(seq 1 10); do
          docker exec {{ engine_container }} test -S '{{ _handoff_sock }}' 2>/dev/null && exit 0
          sleep 0.5
        done
        exit 1
      when: ircfiber_engine_id is defined and engine_info.exists and old_pid_raw.rc == 0
      register: sock_ready
      ignore_errors: true
      changed_when: false

    - name: Launch new engine (handoff path)
      ansible.builtin.command:
        cmd: >
          docker exec -d
          -e IRCFIBER_RELOAD_FROM_PID={{ _engine_pid | default('1') }}
          {{ engine_container }}
          /app/irc-fiber-engine-handoff
      when:
        - ircfiber_engine_id is defined
        - sock_ready is succeeded
      register: handoff_launched

    - name: Wait for handoff done marker (old engine completed transfer)
      ansible.builtin.shell: |
        marker="/tmp/ircfiber-handoff-done-{{ ircfiber_engine_id }}"
        for i in $(seq 1 120); do
          if docker exec {{ engine_container }} test -f "$marker" 2>/dev/null; then
            echo "HANDOFF_OK"
            exit 0
          fi
          sleep 0.5
        done
        echo "HANDOFF_TIMEOUT"
        exit 1
      when:
        - ircfiber_engine_id is defined
        - sock_ready is succeeded
      register: handoff_done
      ignore_errors: true
      changed_when: false

    - name: Replace binary after successful handoff
      ansible.builtin.command:
        cmd: docker exec {{ engine_container }} mv -f /app/irc-fiber-engine-handoff /app/irc-fiber-engine
      when:
        - ircfiber_engine_id is defined
        - handoff_done is not skipped
        - handoff_done.stdout | default('') == 'HANDOFF_OK'

    # ── Fallback: hard restart ────────────────────────────────────
    - name: Inject engine binary (restart path)
      ansible.builtin.command:
        cmd: docker cp {{ engine_binary }} {{ engine_container }}:/app/irc-fiber-engine
      when:
        - ircfiber_engine_id is defined
        - engine_info.exists
        - sock_ready is failed or (handoff_done is not skipped and handoff_done.stdout | default('') != 'HANDOFF_OK')

    - name: Restart engine container (hard — this deploy; handoff on next)
      community.docker.docker_container:
        name: "{{ engine_container }}"
        state: started
        restart: true
      when:
        - ircfiber_engine_id is defined
        - engine_info.exists
        - sock_ready is failed or (handoff_done is not skipped and handoff_done.stdout | default('') != 'HANDOFF_OK')
