---
# IRCCloud-style "push binary, bounce process" — lightest possible deploy.
#
# Builds the frontend + D backend binary locally on the control node,
# copies the binary to target hosts, injects it into running containers
# via `docker cp`, then restarts.  No Docker image rebuild needed.
#
# Usage:
#   ansible-playbook playbooks/deploy-binary.yml
#
# Tags (run only what you need):
#   --tags build     # rebuild D + frontend on control node (optional)
#   --tags gateway   # push binary to gateway only
#   --tags engines   # push binary to engines only (serial: 1)
#
# Rollback:
#   The previous binary is saved as <name>.prev on the host.
#   docker cp <name>.prev <container>:/app/<name> && docker restart <container>
#
# Requirements:
#   - Control node: dub/ldc2, npm, or pre-built binaries
#   - Target: Docker, running ircfiber-gateway / ircfiber-engine-* containers
#
# Example workflow:
#   make build                          # pre-build locally
#   ansible-playbook playbooks/deploy-binary.yml   # push & bounce
#
#   # Or let the playbook build (same as make build):
#   ansible-playbook playbooks/deploy-binary.yml -e build_on_control=true

- name: Build D backend + frontend locally (skip if pre-built)
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - build
  tasks:
    - name: Check if binaries exist (skip if pre-built unless forced)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../{{ item }}"
      register: bin_stat
      loop:
        - irc-fiber

    - name: Build D backend (dub build --force)
      when: build_on_control | default(false) or not bin_stat.results[0].stat.exists
      ansible.builtin.command:
        cmd: dub build --force
        chdir: "{{ playbook_dir }}/../.."
      register: dub_out
      changed_when: "'Linking' in dub_out.stdout"

    - name: Build frontend (npm run build)
      when: build_on_control | default(false) or not bin_stat.results[0].stat.exists
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ playbook_dir }}/../../frontend"
      register: npm_out
      changed_when: "'built in' in npm_out.stdout"

- name: Push gateway binary & roll-restart
  hosts: ircfiber_gw
  become: true
  gather_facts: false
  tags:
    - gateway
  vars:
    container_name: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber.prev"
    container_binary: /app/irc-fiber
  tasks:
    - name: Ensure binary directory exists on target
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current running binary as .prev (one-bounce rollback)
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Copy new binary to target host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../irc-fiber"
        dest: "{{ host_binary }}"
        mode: "0755"

    - name: Inject binary into running container via docker cp
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ container_name }}:{{ container_binary }}.new
        docker exec {{ container_name }} mv {{ container_binary }}.new {{ container_binary }}
        docker exec {{ container_name }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: inject
      ignore_errors: true
      changed_when: inject is success

    - name: Fallback — stop container & docker cp (if running inject failed)
      when: inject is failed
      block:
        - name: Stop gateway container
          community.docker.docker_container:
            name: "{{ container_name }}"
            state: stopped

        - name: Copy binary into container layer
          ansible.builtin.shell: |
            CONTAINER_ID=$(docker ps -aq --filter name='^{{ container_name }}$' | head -1)
            if [ -n "$CONTAINER_ID" ]; then
              docker cp {{ host_binary }} $CONTAINER_ID:{{ container_binary }}
            fi
          args:
            executable: /bin/bash

    - name: Restart gateway container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started
        restart: true

    - name: Wait for gateway health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ gateway_http_port | default(8090) }}/health"
        status_code: [200, 404]
      register: health
      retries: 12
      delay: 5
      until: health.status in [200, 404]
      when: not ansible_check_mode
      ignore_errors: true

- name: Push engine binary & roll-restart (one at a time)
  hosts: ircfiber_engines
  become: true
  serial: 1
  gather_facts: false
  tags:
    - engines
  vars:
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber-engine"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber-engine.prev"
    container_binary: /app/irc-fiber-engine
  tasks:
    - name: Check if engine binary exists locally
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../irc-fiber-engine"
      delegate_to: localhost
      register: local_engine_bin

    - name: Skip — no engine binary found
      ansible.builtin.meta: end_host
      when: not local_engine_bin.stat.exists

    - name: Ensure binary directory exists on target
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current engine binary as .prev
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Copy new engine binary to target host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../irc-fiber-engine"
        dest: "{{ host_binary }}"
        mode: "0755"

    - name: Resolve engine container name for this host
      ansible.builtin.set_fact:
        engine_container: "{{ 'ircfiber-engine-' ~ ircfiber_engine_id }}"

    - name: Inject binary into engine container
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ engine_container }}:{{ container_binary }}.new
        docker exec {{ engine_container }} mv {{ container_binary }}.new {{ container_binary }}
        docker exec {{ engine_container }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: engine_inject
      ignore_errors: true
      changed_when: engine_inject is success

    - name: Fallback — stop engine & docker cp
      when: engine_inject is failed
      block:
        - name: Stop engine container
          community.docker.docker_container:
            name: "{{ engine_container }}"
            state: stopped

        - name: Copy binary into engine container layer
          ansible.builtin.shell: |
            CONTAINER_ID=$(docker ps -aq --filter name='^{{ engine_container }}$' | head -1)
            if [ -n "$CONTAINER_ID" ]; then
              docker cp {{ host_binary }} $CONTAINER_ID:{{ container_binary }}
            fi

    - name: Restart engine container
      community.docker.docker_container:
        name: "{{ engine_container }}"
        state: started
        restart: true

    - name: Cooldown — let engine re-register before next host
      ansible.builtin.pause:
        seconds: 15
