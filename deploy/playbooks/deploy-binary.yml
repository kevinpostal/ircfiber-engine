---
# IRCCloud-style "build on metal, bounce process" — lightest possible deploy.
#
# Syncs the local source tree to the target machine (uses the same
# ircfiber_repo_root variable as the Docker image build), compiles the
# D binary natively on the target, copies it into the running container,
# and restarts.  Avoids the Docker multi-stage build (which installs LDC
# from scratch every time).
#
# Usage:
#   make update
#   make update ARGS="--tags gateway --tags engines"   # include engines
#
# Prerequisites (target):
#   - ldc2 + dub installed (cached across builds)
#   - Node.js + npm installed (for frontend build)
#   - Docker running, container name ircfiber-gateway
#
# Rollback:
#   docker cp /opt/ircfiber/bin/irc-fiber.prev ircfiber-gateway:/app/irc-fiber
#   docker restart ircfiber-gateway

- name: Sync source to target & build
  hosts: "{{ target | default('ircfiber_gw') }}"
  gather_facts: true
  tags:
    - build
    - always
  vars:
    src_root: /opt/ircfiber-src
  tasks:
    - name: Ensure source directory exists on target
      ansible.builtin.file:
        path: "{{ src_root }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Sync local source tree to target (rsync over SSH)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=irc-fiber"
          - "--exclude=irc-fiber-engine"
          - "--exclude=frontend/node_modules"
          - "--exclude=public/dist"

    - name: Build D backend (dub build --force)
      ansible.builtin.command:
        cmd: dub build --force
        chdir: "{{ src_root }}"
      register: dub_out
      changed_when: "'Linking' in dub_out.stdout"
      environment:
        HOME: /root

    - name: Build frontend (npm ci && npm run build)
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ src_root }}/frontend"
      loop:
        - npm ci
        - npm run build
      register: npm_out
      changed_when: "'built in' in npm_out.stdout"

- name: Push gateway binary & roll-restart
  hosts: ircfiber_gw
  become: true
  gather_facts: false
  tags:
    - gateway
  vars:
    container_name: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    src_root: /opt/ircfiber-src
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber.prev"
    container_binary: /app/irc-fiber
  tasks:
    - name: Ensure binary directory exists on target
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current binary as .prev (one-bounce rollback)
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Copy freshly-built binary to deploy path
      ansible.builtin.copy:
        src: "{{ src_root }}/irc-fiber"
        dest: "{{ host_binary }}"
        remote_src: true
        mode: "0755"

    - name: Inject binary into running container
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ container_name }}:{{ container_binary }}.new && \
        docker exec {{ container_name }} mv {{ container_binary }}.new {{ container_binary }} && \
        docker exec {{ container_name }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: inject
      ignore_errors: true
      changed_when: inject is success

    - name: Fallback — stop container, docker cp, restart
      when: inject is failed
      block:
        - name: Stop gateway container
          community.docker.docker_container:
            name: "{{ container_name }}"
            state: stopped

        - name: Copy binary into container
          ansible.builtin.shell: |
            CID=$(docker ps -aq --filter name='^{{ container_name }}$' | head -1)
            if [ -n "$CID" ]; then docker cp {{ host_binary }} "$CID":{{ container_binary }}; fi

    - name: Restart gateway container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started
        restart: true

    - name: Wait for gateway health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ gateway_http_port | default(8090) }}/health"
        status_code: [200, 404]
      register: health
      retries: 12
      delay: 5
      until: health.status in [200, 404]
      when: not ansible_check_mode
      ignore_errors: true

- name: Push engine binary & roll-restart (one at a time)
  hosts: ircfiber_engines
  become: true
  serial: 1
  gather_facts: false
  tags:
    - engines
  vars:
    src_root: /opt/ircfiber-src
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber-engine"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber-engine.prev"
    container_binary: /app/irc-fiber-engine
  tasks:
    - name: Check if engine binary was built
      ansible.builtin.stat:
        path: "{{ src_root }}/irc-fiber-engine"
      register: engine_src

    - name: Skip — no engine binary found
      ansible.builtin.meta: end_host
      when: not engine_src.stat.exists

    - name: Ensure binary directory exists
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current engine binary as .prev
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Copy freshly-built engine binary to deploy path
      ansible.builtin.copy:
        src: "{{ src_root }}/irc-fiber-engine"
        dest: "{{ host_binary }}"
        remote_src: true
        mode: "0755"

    - name: Resolve engine container name
      ansible.builtin.set_fact:
        engine_container: "{{ 'ircfiber-engine-' ~ ircfiber_engine_id }}"

    - name: Inject binary into engine container
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ engine_container }}:{{ container_binary }}.new && \
        docker exec {{ engine_container }} mv {{ container_binary }}.new {{ container_binary }} && \
        docker exec {{ engine_container }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: engine_inject
      ignore_errors: true
      changed_when: engine_inject is success

    - name: Fallback — stop engine, docker cp, restart
      when: engine_inject is failed
      block:
        - name: Stop engine container
          community.docker.docker_container:
            name: "{{ engine_container }}"
            state: stopped

        - name: Copy binary into engine container
          ansible.builtin.shell: |
            CID=$(docker ps -aq --filter name='^{{ engine_container }}$' | head -1)
            if [ -n "$CID" ]; then docker cp {{ host_binary }} "$CID":{{ container_binary }}; fi

    - name: Restart engine container
      community.docker.docker_container:
        name: "{{ engine_container }}"
        state: started
        restart: true

    - name: Cooldown — let engine re-register before next host
      ansible.builtin.pause:
        seconds: 15
