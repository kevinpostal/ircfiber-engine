---
# Build Docker image locally (cross-compile for target arch), push to server,
# restart containers.  Leverages Docker layer caching — LDC installation is
# cached, only the `dub build` step re-runs on source changes.
#
# Usage:
#   make update
#
# How it works:
#   1. Detect target server's OS/arch via ansible
#   2. docker buildx build --platform=linux/amd64 locally (Colima)
#   3. docker save → gzip → copy to target → docker load
#   4. Restart containers (no registry needed)

- name: Detect target architecture
  hosts: "{{ target | default('ircfiber_gw') }}"
  become: true
  gather_facts: true
  tags:
    - detect
  tasks:
    - name: Show target platform
      ansible.builtin.debug:
        msg: "Target: {{ ansible_system }} {{ ansible_architecture }}"

    - name: Set platform fact for Docker buildx
      ansible.builtin.set_fact:
        target_platform: "{{ 'linux/amd64' if ansible_architecture == 'x86_64' else 'linux/arm64' }}"

- name: Build Docker image locally (cross-compile for target)
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - build
  vars:
    tag: "ircfiber:deploy"
    image_path: "/tmp/ircfiber-image.tar.gz"
  tasks:
    - name: Ensure Docker is running (check Colima)
      ansible.builtin.command: docker info
      register: docker_ok
      changed_when: false
      failed_when: false

    - name: Fail if Docker is not running
      ansible.builtin.fail:
        msg: "Docker is not running. Start it: colima start"
      when: docker_ok.rc != 0

    - name: Build Docker image for target platform
      ansible.builtin.shell: |
        docker build \
          --platform {{ hostvars[groups[target | default('ircfiber_gw')][0]].target_platform }} \
          -t {{ tag }} \
          -f {{ playbook_dir }}/../../Containerfile \
          {{ playbook_dir }}/../..
      args:
        executable: /bin/bash
      register: build_out
      changed_when: true
      timeout: 600

    - name: Save image to tarball (docker save + gzip)
      ansible.builtin.shell: |
        docker save {{ tag }} | gzip > {{ image_path }}
      args:
        executable: /bin/bash
      register: save_out
      changed_when: true

    - name: Get image file size
      ansible.builtin.stat:
        path: "{{ image_path }}"
      register: img_stat

    - name: Show image size
      ansible.builtin.debug:
        msg: "Image size: {{ (img_stat.stat.size / 1024 / 1024) | round(1) }} MB"

- name: Copy image to target, load & restart gateway
  hosts: ircfiber_gw
  become: true
  gather_facts: false
  tags:
    - gateway
  vars:
    container_name: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    tag: "ircfiber:deploy"
    image_path: "/tmp/ircfiber-image.tar.gz"
  tasks:
    - name: Copy Docker image tarball to target
      ansible.builtin.copy:
        src: "{{ image_path }}"
        dest: /tmp/ircfiber-image.tar.gz
        mode: "0644"

    - name: Load image into target Docker daemon
      ansible.builtin.shell: |
        docker load < /tmp/ircfiber-image.tar.gz
      args:
        executable: /bin/bash
      register: load_out
      changed_when: "'Loaded image' in load_out.stdout"

    - name: Tag loaded image with consistent name
      ansible.builtin.shell: |
        docker tag {{ tag }} {{ tag }} 2>/dev/null || true

    - name: Stop running container (may be in restart loop)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Recreate gateway container with new image
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ tag }}"
        state: started
        restart_policy: unless-stopped
        command: ["/app/irc-fiber"]
        networks:
          - name: "{{ docker_ircfiber_network | default('ircfiber-net') }}"
        networks_cli_compatible: true
        env_file: /etc/ircfiber/gateway/env
        volumes:
          - "{{ gateway_uploads_volume | default('ircfiber-uploads') }}:/app/uploads"
          - "{{ gateway_logs_volume | default('ircfiber-logs') }}:/var/log/irc-fiber"
        security_opts:
          - "no-new-privileges:true"
        ulimits:
          - "nofile:65536:65536"
        healthcheck:
          test: ["CMD", "curl", "-fsS", "http://localhost:{{ gateway_http_port | default(8090) }}/health"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
        labels:
          com.ircfiber.component: "gateway"
      register: gw_create

    - name: Wait for gateway health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ gateway_http_port | default(8090) }}/health"
        status_code: [200, 404]
      register: health
      retries: 12
      delay: 5
      until: health.status in [200, 404]
      ignore_errors: true

- name: Restart engine container
  hosts: ircfiber_engines
  become: true
  serial: 1
  gather_facts: false
  tags:
    - engines
  vars:
    container_name: "{{ 'ircfiber-engine-' ~ ircfiber_engine_id }}"
    image_path: "/tmp/ircfiber-image.tar.gz"
  tasks:
    - name: Check image tarball exists
      ansible.builtin.stat:
        path: /tmp/ircfiber-image.tar.gz
      register: img_file

    - name: Load image into Docker daemon (if not already)
      when: img_file.stat.exists
      ansible.builtin.shell: |
        docker load < /tmp/ircfiber-image.tar.gz
      args:
        executable: /bin/bash
      register: load_out
      changed_when: "'Loaded image' in load_out.stdout"

    - name: Stop engine container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Recreate engine container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ tag }}"
        state: started
        command: ["/app/irc-fiber-engine"]
        env_file: /etc/ircfiber/engine/env
      register: eng_create

    - name: Cooldown — let engine re-register before next host
      ansible.builtin.pause:
        seconds: 15

- name: Clean up local image tarball
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cleanup
  tasks:
    - name: Remove local image tarball
      ansible.builtin.file:
        path: /tmp/ircfiber-image.tar.gz
        state: absent
