---
# Lightweight deploy using the target's Docker daemon for builds.
#
# Instead of compiling natively (requires LDC installed on host, was slow)
# or cross-compiling locally (QEMU emulation, was very slow), this
# approach rsyncs source to the target and builds INSIDE Docker using the
# Containerfile builder stage — the LDC installation layer is **cached**
# across deploys, only the `dub build` layer re-runs on source changes.
#
# Then the binary is extracted from the builder stage via `docker cp`,
# injected into the running container, and the container is restarted.
# No registry push/pull, no multi-architecture emulation.
#
# Usage:
#   make update                           # gateway + frontend
#   make update ARGS="--tags engines"     # engines too
#   make update ARGS="--tags build"       # source sync + build only
#
# Rollback:
#   Previous binary saved as /opt/ircfiber/bin/irc-fiber.prev
#   docker cp irc-fiber.prev ircfiber-gateway:/app/irc-fiber
#   docker restart ircfiber-gateway

- name: Sync source to target
  hosts: "{{ target | default('ircfiber_gw') }}"
  become: true
  gather_facts: true
  tags:
    - build
    - always
  vars:
    src_root: /opt/ircfiber-src
  tasks:
    - name: Ensure source directory exists
      ansible.builtin.file:
        path: "{{ src_root }}"
        state: directory
        owner: root
        group: root
        mode: "0777"

    - name: Sync local source tree (rsync over SSH)
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=irc-fiber"
          - "--exclude=irc-fiber-engine"
          - "--exclude=frontend/node_modules"
          - "--exclude=public/dist"

- name: Build inside Docker (cached LDC layer) + inject into gateway container
  hosts: ircfiber_gw
  become: true
  gather_facts: false
  tags:
    - build
    - gateway
  vars:
    src_root: /opt/ircfiber-src
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber.prev"
    container_binary: /app/irc-fiber
    container_name: "{{ gateway_container_name | default('ircfiber-gateway') }}"
  tasks:
    - name: Ensure binary directory exists
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current binary as .prev (one-bounce rollback)
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Build D backend inside Docker (cached LDC layer)
      ansible.builtin.shell: |
        cd {{ src_root }}
        # Build only the gateway binary from the Containerfile builder stage
        docker build \
          --target builder \
          -t ircfiber-builder \
          -f Containerfile \
          .
        # Extract the binary from the builder image
        CONTAINER_ID=$(docker create ircfiber-builder)
        docker cp "$CONTAINER_ID":/build/irc-fiber {{ host_binary }}
        docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true
      args:
        executable: /bin/bash
      register: build_out
      changed_when: "'Successfully built' in build_out.stdout"
      timeout: 600

    - name: Build frontend (npm ci && npm run build)
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ src_root }}/frontend"
      loop:
        - npm ci
        - npm run build
      register: npm_out
      changed_when: "'built in' in npm_out.stdout"
      timeout: 120

    - name: Inject binary into running container
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ container_name }}:{{ container_binary }}.new && \
        docker exec {{ container_name }} mv {{ container_binary }}.new {{ container_binary }} && \
        docker exec {{ container_name }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: inject
      ignore_errors: true
      changed_when: inject is success

    - name: Stop container (if inject failed — stuck in restart loop)
      when: inject is failed
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Inject via docker cp after stop (fallback)
      when: inject is failed
      ansible.builtin.shell: |
        CID=$(docker ps -aq --filter name='^{{ container_name }}$' | head -1)
        if [ -n "$CID" ]; then docker cp {{ host_binary }} "$CID":{{ container_binary }}; fi

    - name: Restart gateway container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started
        restart: true

    - name: Wait for gateway health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ gateway_http_port | default(8090) }}/health"
        status_code: [200, 404]
      register: health
      retries: 12
      delay: 5
      until: health.status in [200, 404]
      ignore_errors: true

- name: "Build engine binary & inject (serial: 1)"
  hosts: ircfiber_engines
  become: true
  serial: 1
  gather_facts: false
  tags:
    - engines
  vars:
    src_root: /opt/ircfiber-src
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber-engine"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber-engine.prev"
    container_binary: /app/irc-fiber-engine
    container_name: "{{ 'ircfiber-engine-' ~ ircfiber_engine_id }}"
  tasks:
    - name: Ensure binary directory exists
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current engine binary as .prev
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Build engine binary via Docker builder stage
      ansible.builtin.shell: |
        cd {{ src_root }}
        docker build \
          --target builder \
          -t ircfiber-builder \
          -f Containerfile \
          .
        CONTAINER_ID=$(docker create ircfiber-builder)
        docker cp "$CONTAINER_ID":/build/irc-fiber-engine {{ host_binary }}
        docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true
      args:
        executable: /bin/bash
      register: build_out
      changed_when: "'Successfully built' in build_out.stdout"
      timeout: 600

    - name: Inject engine binary
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ container_name }}:{{ container_binary }}.new && \
        docker exec {{ container_name }} mv {{ container_binary }}.new {{ container_binary }} && \
        docker exec {{ container_name }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: inject
      ignore_errors: true
      changed_when: inject is success

    - name: Stop engine (fallback for restart loop)
      when: inject is failed
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Inject via docker cp after stop (fallback)
      when: inject is failed
      ansible.builtin.shell: |
        CID=$(docker ps -aq --filter name='^{{ container_name }}$' | head -1)
        if [ -n "$CID" ]; then docker cp {{ host_binary }} "$CID":{{ container_binary }}; fi

    - name: Restart engine container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started
        restart: true

    - name: Cooldown — let engine re-register before next host
      ansible.builtin.pause:
        seconds: 15
