---
# IRCCloud-style "build on metal, bounce process" — lightest possible deploy.
#
# Clones/pulls the repo on the target machine, builds the D binary natively
# (no Docker build-stage overhead), copies it into the running container,
# and restarts.  The Docker multi-stage build (Containerfile) installs LDC
# from scratch every time — this playbook skips all of that by building
# on the bare host where LDC can be cached between deploys.
#
# Usage:
#   ansible-playbook playbooks/deploy-binary.yml
#
# Tags:
#   --tags gateway   # gateway only (default)
#   --tags engines   # engines one-at-a-time with cooldown
#
# Prerequisites (target):
#   - ldc2 + dub installed (via package manager — cached across builds)
#   - Node.js + npm installed (for frontend build)
#   - Docker running
#   - Containers named ircfiber-gateway / ircfiber-engine-*
#
# Rollback:
#   The previous binary is saved as <name>.prev on the host.
#   docker cp <name>.prev <container>:/app/<name> && docker restart <container>

- name: Build D backend + frontend on the target machine
  hosts: "{{ target | default('ircfiber_gw') }}"
  become: true
  gather_facts: true
  tags:
    - build
    - always
  vars:
    src_root: /opt/ircfiber-src
    repo_url: "{{ ircfiber_repo_url | default('https://github.com/ircfiber/irc-fiber.git') }}"
    repo_branch: "{{ ircfiber_repo_branch | default('main') }}"
  tasks:
    - name: Ensure build dependencies are present
      ansible.builtin.package:
        name:
          - ldc
          - dub
          - nodejs
          - npm
          - git
          - curl
          - libssl-dev
          - zlib1g-dev
          - pkg-config
        state: present
      when: ansible_pkg_mgr != 'unknown'

    - name: Ensure source directory exists
      ansible.builtin.file:
        path: "{{ src_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Clone or pull latest source
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ src_root }}"
        version: "{{ repo_branch }}"
        force: true
        update: true

    - name: Build D backend (dub build --force)
      ansible.builtin.command:
        cmd: dub build --force
        chdir: "{{ src_root }}"
      register: dub_out
      changed_when: "'Linking' in dub_out.stdout"
      environment:
        HOME: /root

    - name: Build frontend (npm ci && npm run build)
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ src_root }}/frontend"
      loop:
        - npm ci
        - npm run build
      register: npm_out
      changed_when: "'built in' in npm_out.stdout"

- name: Push gateway binary & roll-restart
  hosts: ircfiber_gw
  become: true
  gather_facts: false
  tags:
    - gateway
  vars:
    container_name: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    src_root: /opt/ircfiber-src
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber.prev"
    container_binary: /app/irc-fiber
  tasks:
    - name: Ensure binary directory exists on target
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current running binary as .prev (one-bounce rollback)
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Copy freshly-built binary to deploy path
      ansible.builtin.copy:
        src: "{{ src_root }}/irc-fiber"
        dest: "{{ host_binary }}"
        remote_src: true
        mode: "0755"

    - name: Inject binary into running container
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ container_name }}:{{ container_binary }}.new && \
        docker exec {{ container_name }} mv {{ container_binary }}.new {{ container_binary }} && \
        docker exec {{ container_name }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: inject
      ignore_errors: true
      changed_when: inject is success

    - name: Fallback — stop container, docker cp, start
      when: inject is failed
      block:
        - name: Stop gateway container
          community.docker.docker_container:
            name: "{{ container_name }}"
            state: stopped

        - name: Copy binary into stopped container layer
          ansible.builtin.shell: |
            CID=$(docker ps -aq --filter name='^{{ container_name }}$' | head -1)
            if [ -n "$CID" ]; then docker cp {{ host_binary }} "$CID":{{ container_binary }}; fi
          args:
            executable: /bin/bash

    - name: Restart gateway container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started
        restart: true

    - name: Wait for gateway health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ gateway_http_port | default(8090) }}/health"
        status_code: [200, 404]
      register: health
      retries: 12
      delay: 5
      until: health.status in [200, 404]
      when: not ansible_check_mode
      ignore_errors: true

- name: Push engine binary & roll-restart (one at a time)
  hosts: ircfiber_engines
  become: true
  serial: 1
  gather_facts: false
  tags:
    - engines
  vars:
    src_root: /opt/ircfiber-src
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber-engine"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber-engine.prev"
    container_binary: /app/irc-fiber-engine
  tasks:
    - name: Check if engine binary was built
      ansible.builtin.stat:
        path: "{{ src_root }}/irc-fiber-engine"
      register: engine_src

    - name: Skip — no engine binary in build output
      ansible.builtin.meta: end_host
      when: not engine_src.stat.exists

    - name: Ensure binary directory exists on target
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current engine binary as .prev
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Copy freshly-built engine binary to deploy path
      ansible.builtin.copy:
        src: "{{ src_root }}/irc-fiber-engine"
        dest: "{{ host_binary }}"
        remote_src: true
        mode: "0755"

    - name: Resolve engine container name for this host
      ansible.builtin.set_fact:
        engine_container: "{{ 'ircfiber-engine-' ~ ircfiber_engine_id }}"

    - name: Inject binary into engine container
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ engine_container }}:{{ container_binary }}.new && \
        docker exec {{ engine_container }} mv {{ container_binary }}.new {{ container_binary }} && \
        docker exec {{ engine_container }} chmod +x {{ container_binary }}
      args:
        executable: /bin/bash
      register: engine_inject
      ignore_errors: true
      changed_when: engine_inject is success

    - name: Fallback — stop engine, docker cp, start
      when: engine_inject is failed
      block:
        - name: Stop engine container
          community.docker.docker_container:
            name: "{{ engine_container }}"
            state: stopped

        - name: Copy binary into stopped engine layer
          ansible.builtin.shell: |
            CID=$(docker ps -aq --filter name='^{{ engine_container }}$' | head -1)
            if [ -n "$CID" ]; then docker cp {{ host_binary }} "$CID":{{ container_binary }}; fi

    - name: Restart engine container
      community.docker.docker_container:
        name: "{{ engine_container }}"
        state: started
        restart: true

    - name: Cooldown — let engine re-register before next host
      ansible.builtin.pause:
        seconds: 15
