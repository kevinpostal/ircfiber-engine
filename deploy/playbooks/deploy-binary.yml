---
# Deploy: rsync source → native build on target → inject binary → restart
#
# The target has LDC/DUB installed (apt-get, cached across runs).
# dub compiles natively at full speed (no Docker overhead).
# Compiled artifacts cached in /opt/ircfiber-src/.dub/ between builds.
#
# First build takes 2-5 minutes (downloading + compiling dependencies).
# Subsequent builds are incremental (only changed files recompiled).
#
# Usage:
#   make update
#
# Watch progress in another terminal:
#   ansible ircfiber-prod-1 -m shell -a "tail -f /tmp/dub-build.log"

- name: Sync source to target & build
  hosts: "{{ target | default('ircfiber_gw') }}"
  become: true
  gather_facts: false
  tags:
    - build
    - always
  vars:
    src_root: /opt/ircfiber-src
  tasks:
    - name: Ensure source directory exists
      ansible.builtin.file:
        path: "{{ src_root }}"
        state: directory
        owner: root
        group: root
        mode: "0777"

    - name: Sync local source tree (rsync over SSH)
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=irc-fiber"
          - "--exclude=irc-fiber-engine"
          - "--exclude=frontend/node_modules"
          - "--exclude=public/dist"

    - name: Build D backend (streams to /tmp/dub-build.log)
      ansible.builtin.shell: |
        killall -9 dub ldc2 2>/dev/null || true
        cd {{ src_root }}
        dub build --build=release --force --parallel 2>&1 | tee /tmp/dub-build.log
        exit "${PIPESTATUS[0]}"
      args:
        executable: /bin/bash
      register: dub_out
      changed_when: "'Linking' in dub_out.stdout"
      environment:
        HOME: /root
      timeout: 1800

    - name: Build D engine
      ansible.builtin.shell: |
        cd {{ src_root }}
        dub build --config=engine --build=release --force --parallel 2>&1 | tee /tmp/dub-engine.log
        exit "${PIPESTATUS[0]}"
      args:
        executable: /bin/bash
      register: eng_out
      changed_when: "'Linking' in eng_out.stdout"
      environment:
        HOME: /root
      timeout: 1800

    - name: Build frontend
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ src_root }}/frontend"
      loop:
        - npm ci
        - npm run build
      register: npm_out
      changed_when: "'built in' in npm_out.stdout"
      timeout: 120

- name: Inject gateway binary & restart
  hosts: ircfiber_gw
  become: true
  gather_facts: false
  tags:
    - gateway
  vars:
    container_name: "{{ gateway_container_name | default('ircfiber-gateway') }}"
    src_root: /opt/ircfiber-src
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber"
    host_binary_prev: "{{ host_binary_dir }}/irc-fiber.prev"
    container_binary: /app/irc-fiber
  tasks:
    - name: Ensure binary dir exists
      ansible.builtin.file:
        path: "{{ host_binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Save current binary as .prev
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ host_binary_prev }}"
        remote_src: true
        mode: "0755"
      ignore_errors: true

    - name: Copy fresh binary to deploy path
      ansible.builtin.copy:
        src: "{{ src_root }}/irc-fiber"
        dest: "{{ host_binary }}"
        remote_src: true
        mode: "0755"

    - name: Stop stuck container (if in restart loop from prior failed deploy)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Copy binary into container (works on stopped containers)
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ container_name }}:{{ container_binary }}
      args:
        executable: /bin/bash

    - name: Start gateway container (new binary already in place)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started
        restart: true

- name: "Inject engine binary & restart (serial: 1)"
  hosts: ircfiber_engines
  become: true
  serial: 1
  gather_facts: false
  tags:
    - engines
  vars:
    src_root: /opt/ircfiber-src
    container_name: "{{ 'ircfiber-engine-' ~ ircfiber_engine_id }}"
    host_binary_dir: /opt/ircfiber/bin
    host_binary: "{{ host_binary_dir }}/irc-fiber-engine"
    container_binary: /app/irc-fiber-engine
  tasks:
    - name: Check engine binary exists
      ansible.builtin.stat:
        path: "{{ src_root }}/irc-fiber-engine"
      register: eng_src

    - name: Skip — no engine binary
      ansible.builtin.meta: end_host
      when: not eng_src.stat.exists

    - name: Copy engine binary to deploy path
      ansible.builtin.copy:
        src: "{{ src_root }}/irc-fiber-engine"
        dest: "{{ host_binary }}"
        remote_src: true
        mode: "0755"

    - name: Stop stuck engine (if in restart loop)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Copy binary into engine container (works on stopped containers)
      ansible.builtin.shell: |
        docker cp {{ host_binary }} {{ container_name }}:{{ container_binary }}
      args:
        executable: /bin/bash

    - name: Start engine container (new binary already in place)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started
        restart: true

    - name: Cooldown
      ansible.builtin.pause:
        seconds: 15
