---
# Enterprise deployment: two-container holder + engine architecture.
#
# Architecture:
#   ┌──────────────┐  Unix socket  ┌──────────────┐  TCP/TLS  ┌───────┐
#   │   holder     │ ◄───────────► │    engine    │ ────────► │  IRC  │
#   │ (long-lived) │               │ (reloadable) │           │ server│
#   └──────────────┘               └──────────────┘           └───────┘
#
# The holder is a separate Docker container that owns the IRC TCP/TLS
# sockets. It exposes health/metrics endpoints over a Unix socket.
#
# The engine is the existing IRC fiber engine, configured with
# IRCFIBER_HOLDER_SOCK so it routes all I/O through the holder.
#
# Both containers share a Docker volume for the Unix-domain IPC sockets.
#
# Deployment flow:
#   1. BuildKit builds both binaries (engine + holder)
#   2. Update holder image (immutable, restartable independently)
#   3. Update engine image (uses holder)
#   4. Rollout order: holder FIRST (engine waits for healthy holder),
#      then engine. Hot-reload of engine is via exec() — IRC connection
#      stays alive.

- name: Two-container holder + engine deployment
  hosts: "{{ target | default('ircfiber_engines') }}"
  become: true
  gather_facts: false

  vars:
    src_root: /opt/ircfiber-src
    builder_image: ircfiber-builder
    host_bin_dir: /opt/ircfiber/bin
    holder_container: "ircfiber-holder-{{ ircfiber_engine_id }}"
    engine_container: "ircfiber-engine-{{ ircfiber_engine_id }}"
    healthcheck_retries: 30
    healthcheck_interval_seconds: 2

  pre_tasks:
    - name: Preflight — ircfiber_engine_id is required
      ansible.builtin.assert:
        that:
          - ircfiber_engine_id is defined
          - ircfiber_engine_id | length > 0
        fail_msg: "ircfiber_engine_id must be defined"

  tasks:
    # ── Build ────────────────────────────────────────────────────────
    - name: Ensure output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ host_bin_dir }}"
        - "{{ src_root }}"

    - name: rsync source → {{ src_root }}
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ src_root }}"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.dub"
          - "--exclude=*.o"
          - "--exclude=irc-fiber"
          - "--exclude=irc-fiber-engine"
          - "--exclude=ircfiber-conn-holder"
          - "--exclude=frontend/node_modules"
          - "--exclude=public/dist"
          - "--exclude=.reasonix"
          - "--exclude=.playwright-mcp"
          - "--exclude=test-results"
          - "--exclude=e2e/test-results"
          - "--exclude=*.log"
          - "--exclude=.worktrees"

    - name: Build stage (BuildKit — cached dub + LDC)
      ansible.builtin.shell: |
        DOCKER_BUILDKIT=1 docker build \
          --target builder \
          --build-arg LDC_VERSION=1.41.0 \
          --build-arg CACHE_BUST=$(date +%s) \
          -t {{ builder_image }}:latest \
          -f {{ src_root }}/Containerfile \
          {{ src_root }} 2>&1 | tail -10
      args:
        executable: /bin/bash
      timeout: 900
      changed_when: true

    # ── Stop the engine first (preserves holder state) ───────────────
    - name: Stop the engine container (holder keeps IRC connections alive)
      community.docker.docker_container:
        name: "{{ engine_container }}"
        state: absent
      ignore_errors: true

    - name: Stop the old holder container
      community.docker.docker_container:
        name: "{{ holder_container }}"
        state: absent
      ignore_errors: true

    # ── Deploy holder (immutable, can be replaced independently) ────
    - name: Create the holder-sockets shared volume
      community.docker.docker_volume:
        name: "ircfiber-holder-sockets-{{ ircfiber_engine_id }}"

    - name: Start the new holder container
      community.docker.docker_container:
        name: "{{ holder_container }}"
        image: "{{ builder_image }}:latest"
        command: ["/app/ircfiber-conn-holder"]
        init: true
        restart_policy: unless-stopped
        volumes:
          - "ircfiber-holder-sockets-{{ ircfiber_engine_id }}:/var/run/ircfiber"
        env:
          IRCFIBER_HOLDER_SOCK: "/var/run/ircfiber/holder.sock"
          IRCFIBER_HOLDER_HEALTH_SOCK: "/var/run/ircfiber/holder-health.sock"
          IRCFIBER_HOLDER_QUIT_MSG: "ircfiber holder redeploying"
        networks:
          - name: ircfiber_net
        state: started

    - name: Wait for holder healthz to become ready
      ansible.builtin.shell: |
        for i in $(seq 1 {{ healthcheck_retries }}); do
          if docker exec {{ holder_container }} bash -c '
            [ -S /var/run/ircfiber/holder-health.sock ] &&
            curl -fsS --unix-socket /var/run/ircfiber/holder-health.sock http://localhost/healthz >/dev/null 2>&1
          '; then
            echo "HOLDER_READY"
            exit 0
          fi
          sleep {{ healthcheck_interval_seconds }}
        done
        echo "HOLDER_NOT_READY"
        docker logs {{ holder_container }} 2>&1 | tail -20
        exit 1
      args:
        executable: /bin/bash
      register: holder_ready
      failed_when: holder_ready.stdout != "HOLDER_READY"
      changed_when: false

    # ── Deploy engine ────────────────────────────────────────────────
    - name: Start the engine container (with holder mode)
      community.docker.docker_container:
        name: "{{ engine_container }}"
        image: "{{ builder_image }}:latest"
        command: ["/app/irc-fiber-engine"]
        init: true
        restart_policy: unless-stopped
        volumes:
          - "ircfiber-holder-sockets-{{ ircfiber_engine_id }}:/var/run/ircfiber:ro"
        env:
          IRCFIBER_REDIS_URL: "redis://{{ redis_container_name | default('ircfiber-redis') }}:6379/0"
          IRCFIBER_MONGO_URL: "mongodb://{{ mongo_container_name | default('ircfiber-mongo') }}:27017/ircfiber"
          IRCFIBER_SERVER_ID: "{{ ircfiber_engine_id }}"
          IRCFIBER_BIND_ADDRESS: "0.0.0.0"
          IRCFIBER_LOG_LEVEL: "info"
          # ← enables holder mode
          IRCFIBER_HOLDER_SOCK: "/var/run/ircfiber/holder.sock"
        networks:
          - name: ircfiber_net
        state: started

    - name: Wait for engine to connect to holder (readyz)
      ansible.builtin.shell: |
        for i in $(seq 1 {{ healthcheck_retries }}); do
          # Engine is healthy when:
          #   1. Its PID exists
          #   2. The holder sees at least one engine peer connected
          if docker exec {{ engine_container }} pidof irc-fiber-engine >/dev/null 2>&1; then
            PEERS=$(curl --unix-socket /var/run/ircfiber/holder.sock -s -X GET \
              http://localhost/metrics 2>/dev/null | grep ircfiber_holder_engine_peers | awk '{print $2}')
            if [ "${PEERS%.*}" -ge 1 ]; then
              echo "ENGINE_READY peers=${PEERS}"
              exit 0
            fi
          fi
          sleep {{ healthcheck_interval_seconds }}
        done
        echo "ENGINE_NOT_READY"
        docker logs {{ engine_container }} 2>&1 | tail -20
        exit 1
      args:
        executable: /bin/bash
      register: engine_ready
      failed_when: "'ENGINE_READY' not in engine_ready.stdout"
      changed_when: false

    - name: Report success
      ansible.builtin.debug:
        msg: |
          ✓ Two-container deployment successful.
            Holder: {{ holder_container }} (long-lived, IRC socket owner)
            Engine: {{ engine_container }} (exec-reloadable worker)
            Holder mode: ENABLED (IRCFIBER_HOLDER_SOCK set)
            IRC connections: preserved by holder (no nick collision)
            Health:    unix:///var/run/ircfiber/holder-health.sock/healthz
            Metrics:   unix:///var/run/ircfiber/holder-health.sock/metrics

    # ── Fallback: if engine fails to start, leave holder running ────
    # This way, the operator can investigate without losing IRC state.
    - name: Deployment FAILED — holder is left running for diagnostics
      ansible.builtin.debug:
        msg: |
          Engine failed to become ready:
            engine_ready: {{ engine_ready.stdout | default('SKIPPED') }}
          The holder is left running so IRC connections survive.
          Check engine logs and re-run the playbook.
      when: engine_ready is failed or 'ENGINE_READY' not in engine_ready.stdout

    # ── Operations helpers (optional tasks) ──────────────────────────
    - name: Optional — show holder health
      ansible.builtin.command:
        cmd: docker exec {{ holder_container }} bash -c 'curl -fsS --unix-socket /var/run/ircfiber/holder-health.sock http://localhost/healthz && echo ""'
      register: healthz
      changed_when: false
      failed_when: false
      when: engine_ready is succeeded

    - name: Optional — show holder metrics
      ansible.builtin.command:
        cmd: docker exec {{ holder_container }} bash -c 'curl -fsS --unix-socket /var/run/ircfiber/holder-health.sock http://localhost/metrics'
      register: metrics
      changed_when: false
      failed_when: false
      when: engine_ready is succeeded

    - name: Print holder health/metrics
      ansible.builtin.debug:
        msg: |
          healthz: {{ healthz.stdout | default('N/A') }}
          metrics: {{ metrics.stdout | default('N/A') }}
      when: engine_ready is succeeded