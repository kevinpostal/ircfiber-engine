[defaults]
inventory = inventories/production/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Use the built-in 'default' callback and have it render output as YAML.
# The community.general.yaml callback was removed in 12.0.0 and
# ansible-core 2.20 doesn't ship a separate yaml callback.
stdout_callback = default
result_format = yaml
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ircfiber-ansible-facts
fact_caching_timeout = 7200
interpreter_python = auto_silent
deprecation_warnings = False

# Vault: uncomment to read the vault password from a file instead of
# prompting every time. Create the file with:
#   printf 'your-vault-pass\n' > ~/.vault_pass.txt && chmod 600 ~/.vault_pass.txt
# Override at runtime with --vault-password-file <path>, --ask-vault-pass,
# or the ANSIBLE_VAULT_PASSWORD_FILE env var.
#vault_password_file = ~/.vault_pass.txt

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
