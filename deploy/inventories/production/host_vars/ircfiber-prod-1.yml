---
# Per-host overrides for ircfiber-prod-1
# Tailscale MagicDNS hostname: ircfiber-prod-1.tail544547.ts.net
# Public IPv4: 47.236.247.169 (per `tailscale netcheck`)
#
# This is the combined gateway + backend + engine host (single-VM deployment).

# --- Engine (combined with gateway on this VM) ------------------------------
ircfiber_engine_id: "ovh"
ircfiber_engine_bind_address: "0.0.0.0"
ircfiber_engine_admin_port: 8091



# --- Caddy: extra public-facing hostnames -----------------------------------
# The default ircfiber_domain ("ircfiber.com") is always served. Anything
# listed here is served in ADDITION to the default. Both share the same
# per-host Caddy site blocks (one block per host), so all security headers /
# WS timeouts / CSP apply to every name.
#
# Per-host TLS is picked automatically by Caddy:
#   - *.ts.net hosts → Tailscale cert manager (real cert, no browser warning)
#   - public domains → ACME (LE) when ircfiber_use_lets_encrypt=true;
#     internal CA (self-signed) otherwise
caddy_extra_serve_hosts:
  - "ircfiber-prod-1.tail544547.ts.net"
  # www.ircfiber.com — CF A record for "www" is managed by the cloudflare role.
  # The apex "ircfiber.com" is already served via ircfiber_domain.
  - "www.ircfiber.com"

# --- TLS for the public domain ---------------------------------------------
# Enable Let's Encrypt so ircfiber.com / www.ircfiber.com get real browser-
# trusted certs once Cloudflare's DNS resolves them to this host's public
# IP. The Caddyfile uses the per-host value here.
ircfiber_use_lets_encrypt: true

# --- Cloudflare DNS (managed by the `cloudflare` role) ----------------------
# Public IP this host's records should resolve to. Discovered via
# `tailscale netcheck`; override here if the host's public IP ever
# changes (e.g. new VM, IP swap).
cloudflare_target_ip: "47.236.247.169"

# --- Observability: Signoz OTel (production) ---------------------------------
# Fully centralized to k3s SigNoz (ubuntu-docker k3s cluster).
# This VM (ovh) ships gateway/engine traces/logs/metrics to the k3s
# otel-collector over Tailscale (100.94.116.56:4318 direct). Also ships
# all Docker container logs via Fluent Bit → same endpoint.
# Gateway uses deployment.environment=prod, service.name=ircfiber-gateway;
# Engine uses deployment.environment=prod, service.name=ircfiber-engine.
# k3s workloads use deployment.environment=dev for disambiguation.
IRCFIBER_OTEL_ENABLED: "1"
IRCFIBER_OTEL_ENDPOINT: "http://100.94.116.56:4318"
OTEL_RESOURCE_ATTRIBUTES: "k8s.cluster.name=ovh-prod,service.name=ircfiber-engine,deployment.environment=prod"
# Centralize all Docker logs to k3s — no local SigNoz/ClickHouse.
ovh_logs_centralize_to_k3s: true
k3s_tailscale_ip: "100.94.116.56"
k3s_signoz_api_url: "https://signoz.ubuntu-docker.tail544547.ts.net"

# --- Mullvad egress pool (6 exits for SuperNets session-limit) ----------------
mullvad_sidecars:
  - { name: "de", exit_node: "100.117.47.8", host_port: 1080 } # de-ber-wg-003
  - { name: "ch", exit_node: "100.104.110.13", host_port: 1081 } # ch-zrh-wg-503
  - { name: "nl", exit_node: "100.123.199.85", host_port: 1082 } # nl-ams-wg-201
  - { name: "se", exit_node: "100.84.2.120", host_port: 1083 } # se-sto-wg-201
  - { name: "gb", exit_node: "100.68.61.54", host_port: 1084 } # gb-lon-wg-001
  - { name: "us", exit_node: "100.126.111.61", host_port: 1085 } # us-atl-wg-001
