[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

# ---------------------------------------------------------------------------
# INPUT: tail Docker container JSON logs
# ---------------------------------------------------------------------------
# Recursion guard: Fluent Bit's own JSON logs are excluded via Path_Exclude
# using the container hash pattern.  In production, also add a grep FILTER
# that drops events where `container_name == "ircfiber-fluent-bit"` after
# enabling the docker filter plugin (requires access to /var/run/docker.sock).
# For local dev the exclusion below is sufficient — Fluent Bit does not
# produce enough JSON log volume to create a feedback loop.
# ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    exclude_path      /var/lib/docker/containers/*ircfiber-fluent-bit*/*.log
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

# ---------------------------------------------------------------------------
# FILTER: extract structured fields from the engine/gateway JSON log line
# Each engine log line is a JSON object with fields like:
#   {"level":"info","time":"...","msg":"...","event":"...","network":"...","traceId":"...","spanId":"..."}
# The engine_json parser deserializes the $log key so these fields become
# individual record attributes in the OTLP export.
# ---------------------------------------------------------------------------
[FILTER]
    Name      parser
    Match     docker.*
    Key_Name  log
    Parser    engine_json

# ---------------------------------------------------------------------------
# OUTPUT: ship parsed logs to SigNoz via OTLP HTTP (port 4318)
# ---------------------------------------------------------------------------
[OUTPUT]
    Name              opentelemetry
    Host              signoz
    Port              4318
    Match             docker.*

