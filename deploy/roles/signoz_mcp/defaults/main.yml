---
# SigNoz MCP server — sidecar to the IRC Fiber SigNoz stack.
# Provides MCP (Model Context Protocol) access to SigNoz telemetry
# for AI assistants and developers.
#
# The MCP server talks to signoz-signoz:8080 over the shared
# ircfiber_logging Docker network and exposes its own HTTP listener
# on the host's Tailscale IP only — not the public internet.
#
# Auto-provisions a dedicated service-account API key on first run
# (stored in /etc/ircfiber/signoz-mcp/.api_key, mode 0600) and
# reuses it on subsequent runs.

signoz_mcp_image: "signoz/signoz-mcp-server:latest"
signoz_mcp_container: "signoz-mcp-server"
signoz_mcp_mem: 512m
signoz_mcp_cpus: 0.25

# Host port for the MCP endpoint. Bound to the Tailscale IP so
# the service is reachable only via the tailnet. Override per
# host in inventories/production/host_vars/<hostname>.yml.
signoz_mcp_bind_address: "{{ caddy_tailscale_logging_address | default('100.126.197.92') }}"
signoz_mcp_port: 3004
signoz_mcp_container_port: 8000

# Service-account role granted to the MCP server. VIEWER is the
# safest default (read-only access to dashboards/alerts/logs/traces).
signoz_mcp_service_account_role: "EDITOR"
signoz_mcp_service_account_name: "signoz-mcp-{{ inventory_hostname_short | default('unknown') }}"

# Admin login used to provision the service account + API key.
# Pulled from existing signoz_alerts role conventions.
signoz_mcp_admin_email: "kevindpostal@gmail.com"
signoz_mcp_admin_org_id: "{{ vault_signoz_org_id | default('019f1235-79b1-787f-b4a9-370824295f2f') }}"
signoz_mcp_admin_password_var: "vault_signoz_admin_password"

# Where to mount the API key on the host.
signoz_mcp_state_dir: "/etc/ircfiber/signoz-mcp"
signoz_mcp_api_key_file: "{{ signoz_mcp_state_dir }}/.api_key"

# Toggle the firewall rule added by this role.
signoz_mcp_open_firewall: true
