---
# Deploy SigNoz alert rules to the SigNoz API.
# Reads the rendered signoz-alerts.yml.j2 template and POSTs each rule
# to signoz-query-service:8080/api/v2/rules. Idempotent: checks for
# existing rule by name before creating/updating.
#
# Gated by deploy_signoz_alerts (default false) in main.yml.
# Requires: signoz_api_key (from vault or env) or signoz_api_key_file.

- name: Read SigNoz API key from vault file
  ansible.builtin.slurp:
    src: "{{ signoz_api_key_file | default('/etc/ircfiber/signoz-mcp/.api_key') }}"
  register: signoz_api_key_b64
  when: signoz_api_key is not defined
  no_log: true

- name: Set signoz_api_key fact
  ansible.builtin.set_fact:
    signoz_api_key: "{{ signoz_api_key_b64.content | b64decode | trim }}"
  when: signoz_api_key is not defined
  no_log: true

- name: Render alert rules template to temp file
  ansible.builtin.template:
    src: signoz-alerts.yml.j2
    dest: "{{ remote_tmp_dir | default('/tmp') }}/signoz-alerts-rendered.json"
    mode: "0644"

- name: Read rendered alert rules
  ansible.builtin.slurp:
    src: "{{ remote_tmp_dir | default('/tmp') }}/signoz-alerts-rendered.json"
  register: rendered_alerts

- name: Parse rendered alert rules
  ansible.builtin.set_fact:
    alert_rules: "{{ (rendered_alerts.content | b64decode | from_json).alert_rules }}"

- name: Fetch existing SigNoz alert rules
  ansible.builtin.uri:
    url: "{{ signoz_api_url | default('http://signoz-query-service:8080') }}/api/v2/rules"
    method: GET
    headers:
      SIGNOZ-API-KEY: "{{ signoz_api_key }}"
    status_code: [200]
  register: existing_rules

- name: Build existing alert names map
  ansible.builtin.set_fact:
    existing_alert_names: >-
      {{
        (existing_rules.json.data | default([]))
        | items2dict(key_name='alert', value_name='id')
      }}

- name: Create or update each SigNoz alert rule
  ansible.builtin.uri:
    url: "{{ signoz_api_url | default('http://signoz-query-service:8080') }}/api/v2/rules"
    method: "{{ 'PUT' if item.alert in existing_alert_names else 'POST' }}"
    headers:
      SIGNOZ-API-KEY: "{{ signoz_api_key }}"
      Content-Type: application/json
    body_format: json
    body: "{{ item }}"
    status_code: [200, 201]
  loop: "{{ alert_rules }}"
  loop_control:
    label: "{{ item.alert }}"
  register: alert_deploy_results

- name: Verify all 14 rules deployed
  ansible.builtin.assert:
    that:
      - "{{ alert_deploy_results.results | length == 14 }}"
      - >-
        {{
          alert_deploy_results.results
          | selectattr('status', 'equalto', 200)
          | list | length == 14
        }}
    success_msg: "All 14 SigNoz alert rules deployed successfully"
    fail_msg: >-
      Expected 14 rules deployed, got {{ alert_deploy_results.results | length }}
      with status codes:
      {{ alert_deploy_results.results | map(attribute='status') | join(', ') }}

- name: Clean up temporary files
  ansible.builtin.file:
    path: "{{ remote_tmp_dir | default('/tmp') }}/signoz-alerts-rendered.json"
    state: absent
