# {{ ansible_managed }}
# OpenTelemetry Collector — IRC Fiber observability pipeline.
#
# Receivers: OTLP (gRPC + HTTP) from the engine
# Exporters:  Tempo (traces), Prometheus (metrics — server scraped externally)
# Processors: batch (queue), memory_limiter (back-pressure), resource
#
# Notes:
#   - Logs are intentionally NOT handled here. Promtail already tails
#     Docker json logs and ships to Loki. Mixing them here would create
#     a duplicate pipeline.

receivers:
  otlp:
    protocols:
      grpc:
        # Bind on all interfaces so containers on ircfiber_logging AND
        # ircfiber_net (engine, gateway) can both push.
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Back-pressure: cap memory at 512MB. When exceeded, the collector
  # starts refusing spans instead of OOM-ing.
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Batch spans/metrics before export — reduces backend write load.
  batch:
    timeout: 2s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Inject resource attributes every span should carry.
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: service.namespace
        value: ircfiber
        action: upsert

exporters:
  # Trace storage backend.
  otlp/tempo:
    endpoint: ircfiber-tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

  # Prometheus exporter — runs an internal HTTP server that Prometheus
  # scrapes. The Prometheus container then ingests traces_spanmetrics
  # and exposes them as `traces_*` metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    const_labels:
      source: otel-collector
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

  telemetry:
    logs:
      level: info