---
engine_container_name: "ircfiber-engine-{{ ircfiber_engine_id }}"
engine_no_new_privileges: true
engine_ulimits:
  nofile:
    soft: 65536
    hard: 65536
engine_healthcheck_interval: 30s
engine_healthcheck_timeout: 5s
engine_healthcheck_retries: 3
engine_healthcheck_start_period: 10s
# Mullvad sidecars — 2 on 1 VPS, scalable to 5 via extra entries.
# Each entry: { name: "se", exit_node: "se-sto-wg-101.mullvad.ts.net", port: 1055 }
# The engine's IRCFIBER_MULLVAD_POOL is derived as socks5://tailscale-mullvad-<name>:<port>
mullvad_sidecars: []
# Example (2 sidecars):
# mullvad_sidecars:
#   - { name: "se", exit_node: "se-sto-wg-101.mullvad.ts.net" }
#   - { name: "us", exit_node: "us-nyc-wg-001.mullvad.ts.net" }
mullvad_sidecar_image: "tailscale/tailscale:stable"
mullvad_sidecar_socks_port: 1055

# NordVPN SOCKS5 proxies — no sidecar, no license, no retargeting: each
# entry dials NordVPN's own public proxy host directly with RFC1929
# username/password auth. Each entry falls back to the shared
# vault_nordvpn_socks_username/password (vault.example.yml) when it sets no
# username/password of its own — set them per-entry to spread load across
# more than one NordVPN account, since each account has its own
# connection-concurrency limit. Renders IRCFIBER_NORDVPN_POOL as
# socks5://<name>:<user>:<pass>@<host>:<port>, merged into the same
# picker/ban/circuit-breaker pool as mullvad_sidecars.
nordvpn_proxies: []
# Example (two static exits, verified reachable; second entry shows a
# per-entry credential override for a second NordVPN account):
# nordvpn_proxies:
#   - { name: "nord-nl", host: "nl.socks.nordhold.net", port: 1080 }
#   - { name: "nord-us-atl", host: "atlanta.us.socks.nordhold.net", port: 1080,
#       username: "{{ vault_nordvpn_socks_username_2 }}", password: "{{ vault_nordvpn_socks_password_2 }}" }
