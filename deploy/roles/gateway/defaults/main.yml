---
gateway_container_name: ircfiber-gateway
gateway_no_new_privileges: true
gateway_ulimits:
  nofile:
    soft: 65536
    hard: 65536
gateway_healthcheck_interval: 30s
gateway_healthcheck_timeout: 10s
gateway_healthcheck_retries: 3
gateway_healthcheck_start_period: 40s
# When set, the gateway's admin password is reset to this on every start
# (overrides the source/app.d default 'REDACTED'). Empty = leave default.
ircfiber_admin_password_reset: "{{ vault_ircfiber_admin_password | default('') }}"

# Number of gateway container replicas (1 = single container named ircfiber-gateway).
gateway_replica_count: 1
# When true and replica_count > 1, Caddy uses ip_hash so WebSocket clients stick.
gateway_replica_sticky: true
