---
# Pre-flight: validate the clickhouse-server-overrides.xml locally
# before touching the host. Catches the class of bug (e.g. nested
# <logger>/<log>/<size> in 25.5.x; pool_size * ratio underflow against
# the per-table number_of_free_entries defaults) that would otherwise
# put the clickhouse container into a restart loop on the live server.
# The check is in deploy/test/signoz-config/test-clickhouse-config.sh
# and is intentionally idempotent and ~3s on a warm image cache.
#
# Skip in --check mode (when --check is set, ansible dry-runs the
# role; running docker locally would still be valid, but this avoids
# the side-effect of bringing up a sibling container in CI).
- name: Validate clickhouse-server-overrides.xml locally
  ansible.builtin.command:
    cmd: "test/signoz-config/test-clickhouse-config.sh"
    chdir: "{{ playbook_dir }}/.."
  register: signoz_ch_validate
  changed_when: false
  failed_when: signoz_ch_validate.rc != 0
  when: not ansible_check_mode | default(false)
  become: false          # the validator is read-only on the host (only spins up a sibling container)
  delegate_to: localhost
  run_once: true

- name: Ensure Signoz directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "101"   # clickhouse user/group inside the container (named volumes and log dir)
    group: "101"
    mode: "0755"
  loop:
    - /etc/ircfiber/signoz
    - /var/lib/ircfiber/signoz-clickhouse-logs

- name: Render ingester config
  ansible.builtin.copy:
    src: ingester.yaml
    dest: "/etc/ircfiber/signoz/ingester.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render Keeper config
  ansible.builtin.copy:
    src: keeper.yaml
    dest: "/etc/ircfiber/signoz/keeper.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render ClickHouse server overrides
  ansible.builtin.copy:
    src: clickhouse-server-overrides.xml
    dest: "/etc/ircfiber/signoz/clickhouse-server-overrides.xml"
    owner: root
    group: root
    mode: "0644"

- name: Render docker-compose
  ansible.builtin.template:
    src: docker-compose.signoz.yml.j2
    dest: "/etc/ircfiber/signoz/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Signoz stack
  community.docker.docker_compose_v2:
    project_src: /etc/ircfiber/signoz
    state: present
    pull: missing
    remove_orphans: true

# ClickHouse takes a while to start (bootstraps the keeper, runs any
# pending migrations, and warms the merge pool). Wait for the
# native protocol (9000) to accept connections before running the
# retention ALTERs, otherwise they race the boot and fail with
# "Connection refused".
- name: Wait for ClickHouse native protocol
  ansible.builtin.command:
    cmd: >-
      docker exec signoz-clickhouse
      clickhouse-client --query "SELECT 1"
  register: signoz_clickhouse_ready
  changed_when: false
  retries: 30
  delay: 5
  until: signoz_clickhouse_ready.rc == 0

# Idempotent retention alignment. SigNoz sets _retention_days on
# freshly-ingested rows from the SIGNOZ_DEFAULT_*_RETENTION_DAYS env
# var, but rows that landed before those vars were configured carry
# the column DEFAULT (15) and would otherwise age out 2x slower than
# the dashboards expect.
#
# ALTER TABLE ... MODIFY COLUMN DEFAULT is metadata-only and rewrites
# the column default for any new rows. Existing rows keep the value
# they were written with (15) and will age out naturally on their own
# TTL — we can't UPDATE the column in place because it's used as a
# partition key (ClickHouse rejects with CANNOT_UPDATE_COLUMN). Old
# data evicts at its original 15d ceiling; new data evicts at 7d. Re-
# running is a no-op.
- name: Set log retention default to {{ signoz_logs_retention_days }}d
  ansible.builtin.command:
    cmd: >-
      docker exec signoz-clickhouse
      clickhouse-client --query
      "ALTER TABLE signoz_logs.logs_v2
       MODIFY COLUMN _retention_days UInt16 DEFAULT {{ signoz_logs_retention_days }}"
  register: signoz_log_retention_default
  changed_when: "'Ok.' in signoz_log_retention_default.stdout"
  failed_when:
    - signoz_log_retention_default.rc != 0
    - "'already' not in signoz_log_retention_default.stderr"
  retries: 3
  delay: 5
  until: signoz_log_retention_default.rc == 0

# Trace and metrics tables in this SigNoz build (v0.130.x) don't carry a
# _retention_days column — their retention is encoded as a per-partition
# TTL on the MergeTree engine itself, set when the migrator bootstrapped
# the schema. We do NOT touch those tables here; the env-var-driven
# defaults applied on table creation are authoritative, and the
# SIGNOZ_DEFAULT_TRACES_RETENTION_DAYS / SIGNOZ_DEFAULT_METRICS_RETENTION_DAYS
# env vars in docker-compose.signoz.yml.j2 govern new ingest from this
# point forward.