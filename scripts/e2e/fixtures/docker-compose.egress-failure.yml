# Legacy shared-stack overlay: it cannot prove an exclusive cold fence.
# Use routing_regression.sh egress_failover for isolated Nord qualification.
services:
  ircfiber-engine:
    environment:
      IRCFIBER_MULLVAD_POOL: ""
      IRCFIBER_NORDVPN_POOL: ""
  egress-a:
    image: python:3.12-alpine
    container_name: egress-a
    networks:
      - ircfiber_local
    command: ["python3", "-u", "/fixture/socks_exit.py"]
    volumes:
      - ../../../engine/scripts/e2e/fixtures/socks_exit.py:/fixture/socks_exit.py:ro
  egress-b:
    image: python:3.12-alpine
    container_name: egress-b
    networks:
      - ircfiber_local
    command: ["python3", "-u", "/fixture/socks_exit.py"]
    volumes:
      - ../../../engine/scripts/e2e/fixtures/socks_exit.py:/fixture/socks_exit.py:ro
