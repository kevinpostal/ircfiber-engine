# Compose overlay for scripts/e2e/hot_swap.sh: a mock IRC server on the
# local stack's network (mock-irc:16668, plain TCP). Used as
#   docker compose -f site/deploy/local/docker-compose.yml -f <this file> ...
# The proof reads /tmp/mock-irc.lines and /tmp/holder-mock-irc.result and
# writes /tmp/mock-irc.inject inside this container (docker exec).
services:
  mock-irc:
    image: python:3.12-alpine
    container_name: mock-irc
    networks:
      - ircfiber_local
    command: ["python3", "-u", "/fixture/holder_mock_irc.py", "16668", "/tmp/holder-mock-irc.result"]
    volumes:
      - ./holder_mock_irc.py:/fixture/holder_mock_irc.py:ro
