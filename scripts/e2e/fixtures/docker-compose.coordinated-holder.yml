# Disposable native-Linux fixture. No privileged collector container exists.
services:
  ircfiber-gateway:
    labels:
      com.ircfiber.component: gateway
  ircfiber-engine:
    environment:
      IRCFIBER_MULLVAD_POOL: socks5://dynamic@192.0.2.30:1081
      IRCFIBER_EGRESS_CONTROL_DIR: /egress
    volumes:
      - egress-control:/egress:ro
  ircfiber-sysagent:
    image: ${ROUTING_REGRESSION_GATEWAY_IMAGE:?actual reviewed Site image required}
    platform: linux/amd64
    container_name: ${ROUTING_REGRESSION_RUN}-sysagent
    command: [/app/irc-fiber]
    restart: "no"
    environment:
      IRCFIBER_SYSAGENT: "1"
      IRCFIBER_SYSAGENT_TOKEN: ${COORDINATED_SYSAGENT_TOKEN:?run-owned token required}
      IRCFIBER_OTEL_ENABLED: "0"
      IRCFIBER_BUGSINK_ENABLED: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [fixture]
    labels:
      ircfiber.fixture: routing-regression
      ircfiber.fixture.run: ${ROUTING_REGRESSION_RUN}
      com.ircfiber.component: sysagent
  egress-a:
    command: [python3, -u, /fixture/coordinated_egress.py]
    volumes:
      - egress-control:/control
  mock-irc:
    # No second IPC producer: bounded LIST/STATUS uses the host-root child.
    volumes: !override [fixture-certs:/fixture-certs]
volumes:
  egress-control:
    labels:
      ircfiber.fixture: routing-regression
      ircfiber.fixture.run: ${ROUTING_REGRESSION_RUN}
